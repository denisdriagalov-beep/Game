function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W * dpr); cvs.height = Math.floor(H * dpr);

/* ============================================================

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const now   = () => performance.now();
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
let _seed = 1;
function seedRand(s) { _seed = s | 0; }
function rnd() { _seed = (_seed * 1664525 + 1013904223) | 0; return ((_seed >>> 0) / 4294967296); }
function rr(a, b) { return a + rnd() * (b - a); }

const DEFAULT_SAVE = {

  stars: {},        // missionId -> 0..3
  upgrades: {       // unitKey -> level (1..5)
    kamikaze: 1, heavy: 1, jammer: 1,

  settings: { sound: true, vibrate: true },

};
let Save = JSON.parse(JSON.stringify(DEFAULT_SAVE));
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      Save = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)), o);
      Save.upgrades = Object.assign({}, DEFAULT_SAVE.upgrades, o.upgrades || {});
      Save.unlocked = Object.assign({}, DEFAULT_SAVE.unlocked, o.unlocked || {});
      Save.unlocked.attack = Object.assign({}, DEFAULT_SAVE.unlocked.attack, (o.unlocked||{}).attack||{});
      Save.unlocked.defense = Object.assign({}, DEFAULT_SAVE.unlocked.defense, (o.unlocked||{}).defense||{});
      Save.settings = Object.assign({}, DEFAULT_SAVE.settings, o.settings || {});
    }
  } catch(e) {}
}
function commitSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save)); } catch(e) {}
}

/* ============================================================
   ЗВУК (Web Audio)
   ============================================================ */
let actx = null;
function audioCtx() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return actx;
}
function beep(freq, dur, type, vol) {
  if (!Save.settings.sound) return;
  const a = audioCtx(); if (!a) return;
  try {
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch(e) {}
}
function noise(dur, vol) {
  if (!Save.settings.sound) return;
  const a = audioCtx(); if (!a) return;
  try {
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol || 0.12;
    src.connect(g); g.connect(a.destination);
    src.start();
  } catch(e) {}
}
function vibrate(ms) {
  if (!Save.settings.vibrate) return;
  if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e) {}
}

const cam = {
  x: TARGET_X, y: WORLD_H - 500, zoom: 0.8, targetZoom: 0.8,
  minZoom: 0.25, maxZoom: 2.5, follow: false,
  shakeX: 0, shakeY: 0, shakeMag: 0, shakeTime: 0,
};
function applyCamera() {
  ctx.translate(W / 2 + cam.shakeX, H / 2 + cam.shakeY);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
}
function screenToWorld(sx, sy) {
  return { x: (sx - W/2 - cam.shakeX) / cam.zoom + cam.x,
           y: (sy - H/2 - cam.shakeY) / cam.zoom + cam.y };
}
function zoomAt(sx, sy, newZoom) {
  newZoom = clamp(newZoom, cam.minZoom, cam.maxZoom);
  const before = screenToWorld(sx, sy);
  cam.zoom = newZoom; cam.targetZoom = newZoom;
  const after = screenToWorld(sx, sy);
  cam.x += before.x - after.x; cam.y += before.y - after.y;
  clampCamera();
}
function clampCamera() {
  const halfW = W/2/cam.zoom, halfH = H/2/cam.zoom;
  if (halfW*2 < WORLD_W) cam.x = clamp(cam.x, halfW, WORLD_W - halfW); else cam.x = WORLD_W/2;
  if (halfH*2 < WORLD_H) cam.y = clamp(cam.y, halfH, WORLD_H - halfH); else cam.y = WORLD_H/2;
}
function visibleBounds() {
  const tl = screenToWorld(0, 0), br = screenToWorld(W, H);
  return { x1: tl.x, y1: tl.y, x2: br.x, y2: br.y };
}
function shakeCamera(mag, time) {
  cam.shakeMag = Math.max(cam.shakeMag, mag);
  cam.shakeTime = Math.max(cam.shakeTime, time);
}

/* ============================================================
   МЕСТНОСТЬ
   ============================================================ */
const terrain = { riverPts: [], roads: [], buildings: [], trees: [], parks: [], fields: [] };
function riverAt(y) {
  const p = terrain.riverPts;
  if (p.length < 2) return 500;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i], b = p[i+1];
    if (y >= a.y && y <= b.y) {
      const t = (y - a.y) / (b.y - a.y);
      return a.x + (b.x - a.x) * t;
    }
  }
  return p[p.length-1].x;
}
function generateTerrain() {
  seedRand(20260226);
  terrain.riverPts.length = 0; terrain.roads.length = 0;
  terrain.buildings.length = 0; terrain.trees.length = 0;
  terrain.parks.length = 0; terrain.fields.length = 0;

  let rx = 480;
  for (let y = -100; y <= WORLD_H + 100; y += 90) {
    rx += rr(-55, 55); rx = clamp(rx, 280, 680);
    terrain.riverPts.push({ x: rx, y });
  }
  for (const y of [600, 1400, 2200, 3000])
    terrain.roads.push({ x1: 0, y1: y, x2: WORLD_W, y2: y, w: 55, major: true });
  for (const x of [820, 1180, 1600])
    terrain.roads.push({ x1: x, y1: 0, x2: x, y2: WORLD_H, w: 55, major: true });
  for (let i = 0; i < 10; i++) {
    const y = rr(200, WORLD_H - 200);
    terrain.roads.push({ x1: 0, y1: y, x2: WORLD_W, y2: y, w: 24, major: false });
  }
  for (let i = 0; i < 7; i++) {
    const x = rr(200, WORLD_W - 200);
    terrain.roads.push({ x1: x, y1: 0, x2: x, y2: WORLD_H, w: 24, major: false });
  }
  for (let i = 0; i < 18; i++)
    terrain.fields.push({ x: rr(0, WORLD_W-400), y: rr(0, WORLD_H-400),
      w: rr(250, 600), h: rr(250, 550),
      color: rnd() < 0.5 ? '#2e3d20' : '#3a4526' });
  for (let i = 0; i < 6; i++)
    terrain.parks.push({ x: rr(150, WORLD_W-550), y: rr(200, WORLD_H-550),
      w: rr(250, 450), h: rr(250, 450) });

  const zones = [
    { x1: 750, y1: 200, x2: 1700, y2: 900, d: 30 },
    { x1: 850, y1: 1200, x2: 1700, y2: 1900, d: 22 },
    { x1: 200, y1: 2400, x2: 1000, y2: 3100, d: 15 },
    { x1: 1300, y1: 2300, x2: 1900, y2: 3200, d: 15 },
  ];
  for (const z of zones) {
    for (let i = 0; i < z.d; i++) {
      const bw = rr(55, 140), bh = rr(55, 140);
      const bx = rr(z.x1, z.x2 - bw), by = rr(z.y1, z.y2 - bh);
      if (Math.abs(bx + bw/2 - riverAt(by + bh/2)) < 110) continue;
      terrain.buildings.push({ x: bx, y: by, w: bw, h: bh,
        type: rnd() < 0.35 ? 'tall' : 'low', shade: rr(0.65, 1.05) });
    }
  }
  for (let i = 0; i < 650; i++) {
    const tx = rr(40, WORLD_W-40), ty = rr(40, WORLD_H-40);
    if (Math.abs(tx - riverAt(ty)) < 90) continue;
    let skip = false;
    for (const r of terrain.roads) {
      if (r.major) {
        if (r.x1 === 0 && Math.abs(ty - r.y1) < 65) { skip = true; break; }
        if (r.y1 === 0 && Math.abs(tx - r.x1) < 65) { skip = true; break; }
      }
    }
    if (skip) continue;
    for (const b of terrain.buildings)
      if (tx > b.x-20 && tx < b.x+b.w+20 && ty > b.y-20 && ty < b.y+b.h+20) { skip = true; break; }
    if (skip) continue;
    terrain.trees.push({ x: tx, y: ty, r: rr(11, 22), shade: rr(0.5, 1.0) });
  }
}

const DEFENSE_UNITS = {

function unitStat(base, lvl) {
  const mulH = 1 + 0.12 * (lvl - 1);
  const mulD = 1 + 0.08 * (lvl - 1);
  return { hp: Math.round(base.hp * mulH), damage: Math.round(base.damage * mulD) };
}

/* ============================================================
   СУЩНОСТИ
   ============================================================ */
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.life=life; this.maxLife=life; this.color=color; this.size=size||3;
  }
  update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.vx*=0.94; this.vy*=0.94; this.life-=dt; }
  get dead(){ return this.life<=0; }
}
class Tracer {
  constructor(x1,y1,x2,y2,color){ this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;
    this.life=0.16; this.maxLife=0.16; this.color=color||'#ffd24a'; }
  update(dt){ this.life-=dt; }
  get dead(){ return this.life<=0; }
}
class DamageText {
  constructor(x,y,val,color){ this.x=x;this.y=y;this.val=val;this.color=color||'#fff';
    this.life=0.9; this.maxLife=0.9; }
  update(dt){ this.y-=40*dt; this.life-=dt; }
  get dead(){ return this.life<=0; }
}
class Drone {
  constructor(x, y, typeKey, lvl, player) {
    const base = ATTACK_UNITS[typeKey];
    const st = unitStat(base, lvl);
    this.x=x; this.y=y; this.wx=x; this.wy=y;
    this.typeKey = typeKey;
    this.hp=st.hp; this.maxHp=st.hp;
    this.speed=base.speed;
    this.radius=base.radius;
    this.damage=st.damage;
    this.alive=true;
    this.angle=-Math.PI/2;
    this.hitFlash=0;
    this.bob=Math.random()*Math.PI*2;
    this.player = !!player;
    this.jamRadius = base.jamRadius || 0;
    this.jamDuration = base.jamDuration || 0;
    this.jamming = false;
  }
  update(dt){
    if (!this.alive) return;
    this.bob += dt*6;
    const dx=this.wx-this.x, dy=this.wy-this.y;
    const dist=Math.hypot(dx,dy);
    if (dist>3){
      const step=Math.min(dist, this.speed*dt);
      this.x+=(dx/dist)*step; this.y+=(dy/dist)*step;
      const ta=Math.atan2(dy,dx);
      let da=ta-this.angle;
      while(da>Math.PI) da-=Math.PI*2;
      while(da<-Math.PI) da+=Math.PI*2;
      this.angle += da*Math.min(1, dt*6);
    }
    if (this.hitFlash>0) this.hitFlash=Math.max(0, this.hitFlash-dt);
  }
}
class Turret {
  constructor(x, y, typeKey, lvl) {
    const base = DEFENSE_UNITS[typeKey];
    const st = unitStat(base, lvl);
    this.x=x; this.y=y;
    this.typeKey = typeKey;
    this.range = base.range;
    this.fireRate = base.fireRate;
    this.damage = st.damage;
    this.hp = st.hp; this.maxHp = st.hp;
    this.cooldown=0;
    this.alive=true;
    this.angle=-Math.PI/2;
    this.maxCooldown = 1/base.fireRate;
    this.mobile = base.mobile;
    this.jamTime = 0;
  }
  canFire(){ return this.cooldown <= 0 && this.jamTime <= 0; }
  markFired(){ this.cooldown = this.maxCooldown; }
  update(dt){
    if (this.cooldown > 0) this.cooldown = Math.max(0, this.cooldown - dt);
    if (this.jamTime > 0) this.jamTime = Math.max(0, this.jamTime - dt);
  }
  inRange(x,y){ return Math.hypot(x-this.x, y-this.y) <= this.range; }
  aimAt(x,y){ this.angle = Math.atan2(y-this.y, x-this.x); }
}

function setMessage(text, t) { G.message = text; G.messageTime = t || 3; }

/* ============================================================
   СТАРТ МИССИИ
   ============================================================ */
function startMission(mission) {
  G.mission = mission;
  G.side = mission.side;
  G.screen = 'battle';
  G.result = null;
  G.drones = []; G.turrets = []; G.tracers = []; G.particles = []; G.dmgTexts = [];
  G.time = 0; G.messageTime = 0; G.screenFlash = 0;
  G.draggingTurret = null;
  cam.follow = (mission.side === 'attack');
  cam.shakeX = cam.shakeY = 0; cam.shakeMag = 0; cam.shakeTime = 0;

  if (mission.side === 'attack') {
    G.target = { x: TARGET_X, y: TARGET_Y, radius: TARGET_R,
                 hp: mission.targetHp, maxHp: mission.targetHp };
    // Вражеские турели
    for (const e of mission.enemies) {
      const t = new Turret(e.x, e.y, e.type, e.lvl || 1);
      G.turrets.push(t);
    }
    // Очередь вылетов игрока
    G.selectedUnits = [];
    for (const pu of mission.playerUnits) {
      for (let i = 0; i < pu.count; i++) G.selectedUnits.push(pu.type);
    }
    G.deployed = 0;
    cam.x = 1000; cam.y = 3300;
    cam.zoom = cam.targetZoom = 0.85;
    setMessage('Тап по карте — точка сбора. Тап «▲» — запуск БПЛА', 5);
  } else {
    // Оборона
    G.target = { x: TARGET_X, y: TARGET_Y, radius: TARGET_R, hp: 100, maxHp: 100 };
    G.placement = { active: true, placed: 0, required: 4, queue: ['pkt','pkt','zu23','pkt'] };
    G.spawnQueue = mission.enemies ? mission.enemies.length : 6;
    G.waves = mission.enemies || null;
    if (!G.waves) G.spawnQueue = 6;
    cam.x = TARGET_X; cam.y = 1400;
    cam.zoom = cam.targetZoom = 0.55;
    setMessage('Расставьте турели: ' + (G.placement.queue[0] ? DEFENSE_UNITS[G.placement.queue[0]].name : '') , 4);
  }
  clampCamera();
}

function startEndless() {
  const mission = {
    id: 'endless', side: 'defense', name:'Полигон',
    brief:'Бесконечные волны. Рекорд: ' + (Save.endlessBest || 0),
    enemies: null, reward: 0,
  };
  G.endlessWave = 0;
  G.endlessScore = 0;
  startMission(mission);
  G.waves = null;
  G.spawnQueue = 9999;
  G.spawnInterval = 3.5;
  setMessage('Полигон: каждая 10-я волна — сложнее', 4);
}

/* ============================================================
   СПАВН ВРАГОВ (оборона)
   ============================================================ */
function spawnEnemyDrone() {
  const x = rr(300, WORLD_W - 300);
  const types = ['kamikaze','kamikaze','kamikaze','heavy'];
  const tk = types[Math.floor(rnd() * types.length)];
  const lvl = clamp(1 + Math.floor((G.endlessWave || 0) / 3), 1, 5);
  const d = new Drone(x, WORLD_H - 80, tk, lvl, false);
  d.wx = G.target.x + rr(-100, 100);
  d.wy = G.target.y + rr(-20, 20);
  d.speed = rr(110, 155);
  d.hp = Math.round(d.maxHp * 0.6);
  d.maxHp = d.hp;
  G.drones.push(d);
}

/* ============================================================
   БОЕВАЯ ЛОГИКА
   ============================================================ */
function damageDrone(d, dmg, fromX, fromY) {
  if (!d.alive) return;
  d.hp -= dmg; d.hitFlash = 0.12;
  const dx = d.x + rr(-8, 8), dy = d.y - 26 + rr(-4, 4);
  G.dmgTexts.push(new DamageText(dx, dy, dmg, '#ffcc33'));
  sfxHit();
  if (d.hp <= 0) {
    d.alive = false;
    explode(d.x, d.y, false);
    sfxExplode();
    shakeCamera(3, 0.15);
  }
}
function explode(x, y, big) {
  const n = big ? 60 : 30;
  for (let i = 0; i < n; i++) {
    G.particles.push(new Particle(x, y,
      rr(-450, 450), rr(-450, 450),
      rr(0.7, 1.7),
      i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? '#ffcc33' : '#ff5522'),
      big ? 6 : 5));
  }
}
function fireTurretAt(t, tx, ty) {
  t.markFired(); t.aimAt(tx, ty);
  G.tracers.push(new Tracer(t.x, t.y, tx, ty));
  sfxShot();
  for (let i = 0; i < 3; i++)
    G.particles.push(new Particle(
      t.x + Math.cos(t.angle) * 24, t.y + Math.sin(t.angle) * 24,
      rr(-80, 80), rr(-80, 80), 0.25, '#ffd24a', 3));
}

function tryLaunchDrone(wx, wy) {
  if (G.deployed >= G.selectedUnits.length) return;
  const tk = G.selectedUnits[G.deployed];
  const lvl = Save.upgrades[tk] || 1;
  // Стартовая точка — юг карты
  const startX = clamp(wx + rr(-40, 40), 60, WORLD_W - 60);
  const startY = WORLD_H - 100;
  const d = new Drone(startX, startY, tk, lvl, true);
  d.wx = wx; d.wy = wy;
  G.drones.push(d);
  G.deployed++;
  sfxClick();
}

function updateAttack(dt) {
  for (const d of G.drones) {
    if (!d.alive) continue;
    d.update(dt);

    // РЭБ: глушит турели
    if (d.typeKey === 'jammer' && d.jamRadius > 0) {
      for (const t of G.turrets) {
        if (Math.hypot(t.x - d.x, t.y - d.y) < d.jamRadius) t.jamTime = d.jamDuration;
      }
    }

    // Турели стреляют
    for (const t of G.turrets) {
      if (!t.alive || !t.canFire()) continue;
      if (!t.inRange(d.x, d.y)) continue;
      fireTurretAt(t, d.x, d.y);
      damageDrone(d, t.damage);
      if (!d.alive) break;
    }
    if (!d.alive) continue;

    // Достиг цели
    if (G.target) {
      const dist = Math.hypot(G.target.x - d.x, G.target.y - d.y);
      if (dist < G.target.radius + d.radius) {
        if (d.damage > 0) {
          G.target.hp -= d.damage;
          G.dmgTexts.push(new DamageText(G.target.x + rr(-30,30), G.target.y - 40, d.damage, '#ff8844'));
          G.screenFlash = 0.3;
          shakeCamera(5, 0.2);
          explode(d.x, d.y, true);
          sfxExplode();
        }
        d.alive = false;
      }
    }
  }
  if (G.target.hp <= 0) finishMission();
  else if (G.drones.every(d => !d.alive) && G.deployed >= G.selectedUnits.length) {
    finishMission();
  }
}

function updateDefense(dt) {
  if (G.placement.active) return;

  if (G.spawnQueue > 0) {
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) {
      spawnEnemyDrone();
      if (G.mission && G.mission.id !== 'endless') G.spawnQueue--;
      else if (G.mission && G.mission.id === 'endless') {
        G.endlessWave++;
        G.spawnInterval = Math.max(1.8, 3.5 - G.endlessWave * 0.15);
      }
      G.spawnTimer = G.spawnInterval;
      if (G.mission && G.mission.id !== 'endless' && G.spawnQueue === 0)
        setMessage('Последняя цель!', 2);
    }
  }

  for (const d of G.drones) {
    if (!d.alive) continue;
    d.update(dt);
    // РЭБ-эффект на турели от вражеских дронов-камикадзе не применяется; здесь только движение
    if (G.target) {
      const dist = Math.hypot(G.target.x - d.x, G.target.y - d.y);
      if (dist < G.target.radius + d.radius) {
        G.target.hp -= d.damage;
        d.alive = false;
        G.screenFlash = 0.3; shakeCamera(6, 0.25);
        explode(d.x, d.y, true); sfxExplode();
      }
    }
  }

  if (G.target.hp <= 0) { G.result = 'lose'; finishMission(); }
  else if (G.mission.id !== 'endless' && G.spawnQueue === 0 && G.drones.every(d => !d.alive)) {
    finishMission();
  }
}

function computeStars() {
  if (G.side === 'attack') {
    if (G.target.hp <= 0) return 1;
    const remaining = G.target.hp;
    const [s1, s2, s3] = G.mission.starsHp;
    if (remaining >= s3) return 3;
    if (remaining >= s2) return 2;
    return 1;
  } else {
    const hp = G.target.hp;
    if (hp >= 100) return 3;
    if (hp >= 60) return 2;
    return 1;
  }
}

function finishMission() {
  const win = (G.side === 'attack')
    ? (G.target.hp <= 0)
    : (G.target.hp > 0 && G.mission.id !== 'endless');
  G.result = win ? 'win' : 'lose';
  G.screen = 'victory';

  if (G.mission.id === 'endless') {
    if (G.endlessScore > (Save.endlessBest || 0)) {
      Save.endlessBest = G.endlessScore;
      commitSave();
    }
    sfxLose();
    return;
  }

  if (win) {
    const stars = computeStars();
    const id = G.mission.id;
    const prev = Save.stars[id] || 0;
    if (stars > prev) Save.stars[id] = stars;
    const reward = G.mission.reward + stars * 40;
    Save.credits = (Save.credits || 0) + reward;
    G.lastReward = { credits: reward, stars };
    // Анлоки
    if (id === 'a1') Save.unlocked.attack.heavy = true;
    if (id === 'a2') Save.unlocked.attack.jammer = true;
    if (id === 'a3') { Save.unlocked.defense.zu23 = true; }
    if (id === 'a4') { Save.unlocked.defense.igla = true; }
    commitSave();
    sfxWin();
  } else {
    sfxLose();
  }
}

/* ============================================================
   КАМЕРА / ОБНОВЛЕНИЕ
   ============================================================ */
function updateCamera(dt) {
  if (cam.follow && G.side === 'attack') {
    const alive = G.drones.filter(d => d.alive);
    if (alive.length > 0) {
      let cx = 0, cy = 0;
      for (const d of alive) { cx += d.x; cy += d.y; }
      cx /= alive.length; cy /= alive.length;
      cam.x += (cx - cam.x) * Math.min(1, dt * 2.5);
      cam.y += (cy - cam.y) * Math.min(1, dt * 2.5);
    }
  }
  cam.zoom += (cam.targetZoom - cam.zoom) * Math.min(1, dt * 10);
  if (cam.shakeTime > 0) {
    cam.shakeTime -= dt;
    cam.shakeX = rr(-1, 1) * cam.shakeMag;
    cam.shakeY = rr(-1, 1) * cam.shakeMag;
    cam.shakeMag *= 0.9;
    if (cam.shakeTime <= 0) { cam.shakeMag = 0; cam.shakeX = 0; cam.shakeY = 0; }
  }
  clampCamera();
}

function update(dt) {
  for (let i = G.tracers.length-1; i >= 0; i--) {
    G.tracers[i].update(dt); if (G.tracers[i].dead) G.tracers.splice(i,1);
  }
  for (let i = G.particles.length-1; i >= 0; i--) {
    G.particles[i].update(dt); if (G.particles[i].dead) G.particles.splice(i,1);
  }
  for (let i = G.dmgTexts.length-1; i >= 0; i--) {
    G.dmgTexts[i].update(dt); if (G.dmgTexts[i].dead) G.dmgTexts.splice(i,1);
  }
  for (const t of G.turrets) t.update(dt);
  if (G.screenFlash > 0) G.screenFlash = Math.max(0, G.screenFlash - dt);

  if (G.screen !== 'battle') return;
  G.time += dt;
  if (G.messageTime > 0) G.messageTime = Math.max(0, G.messageTime - dt);

  updateCamera(dt);

  if (G.side === 'attack') updateAttack(dt);
  else                     updateDefense(dt);
}

/* ============================================================
   ДЕЙСТВИЯ
   ============================================================ */
function tryPlaceTurret(x, y) {
  if (x < PLACE_ZONE.x1 || x > PLACE_ZONE.x2 || y < PLACE_ZONE.y1 || y > PLACE_ZONE.y2) {
    setMessage('Вне зоны размещения', 1.5); return;
  }
  for (const t of G.turrets) {
    if (Math.hypot(t.x - x, t.y - y) < 130) { setMessage('Слишком близко', 1.5); return; }
  }
  const tk = G.placement.queue[G.placement.placed] || 'pkt';
  const lvl = Save.upgrades[tk] || 1;
  G.turrets.push(new Turret(x, y, tk, lvl));
  G.placement.placed++;
  sfxClick();
  if (G.placement.placed >= G.placement.required) {
    G.placement.active = false;
    setMessage('Оборона готова!', 3);
    G.spawnTimer = 2.0;
  } else {
    const nk = G.placement.queue[G.placement.placed];
    setMessage(`Поставить: ${DEFENSE_UNITS[nk].name} (${G.placement.placed+1}/${G.placement.required})`, 4);
  }
}

function fireAllTurrets() {
  for (const t of G.turrets) {
    if (!t.alive || !t.canFire()) continue;
    let best = null, bd = Infinity;
    for (const d of G.drones) {
      if (!d.alive) continue;
      const dd = Math.hypot(t.x - d.x, t.y - d.y);
      if (dd <= t.range && dd < bd) { bd = dd; best = d; }
    }
    if (!best) continue;
    fireTurretAt(t, best.x, best.y);
    damageDrone(best, t.damage);
  }
}

function setAttackWaypoint(wx, wy) {
  const offsets = [[-80,0],[0,-50],[80,0],[0,50],[-40,-30],[40,30]];
  for (let i = 0; i < G.drones.length; i++) {
    const d = G.drones[i]; if (!d.alive) continue;
    const o = offsets[i % offsets.length];
    d.wx = clamp(wx + o[0], 30, WORLD_W - 30);
    d.wy = clamp(wy + o[1], 30, WORLD_H - 30);
  }
}

/* ============================================================
   UI-КНОПКИ (рисуются в HUD, нажатия обрабатываются)
   ============================================================ */
function drawButton(x, y, w, h, label, active) {
  ctx.fillStyle = active ? 'rgba(90,200,255,0.35)' : 'rgba(20,30,45,0.85)';
  roundRect(ctx, x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle = active ? '#5ac8ff' : 'rgba(150,180,210,0.6)';
  ctx.lineWidth = 2;
  roundRect(ctx, x, y, w, h, 10); ctx.stroke();
  ctx.fillStyle = '#e8f4ff';
  ctx.font = 'bold 15px -apple-system,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w/2, y + h/2);
}

function hitRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }

function getBattleUI() {
  const btns = {};
  const pad = 22;
  const r = 26;
  btns.zoomIn  = { cx: W - pad - r, cy: H - pad - r, r };
  btns.zoomOut = { cx: W - pad - r, cy: H - pad - r - 64, r };
  if (G.side === 'attack') {
    btns.follow = { cx: W - pad - r, cy: H - pad - r - 128, r };
    btns.launch = { x: 14, y: H - 92, w: 130, h: 60 };
  } else {
    if (!G.placement.active) {
      btns.fire = { x: W - 160, y: H - 92, w: 146, h: 60 };
    }
  }
  btns.menu = { x: 14, y: 62, w: 80, h: 34 };
  return btns;
}

function handleBattleTap(clientX, clientY) {
  const btns = getBattleUI();
  // Кнопки
  if (Math.hypot(clientX - btns.zoomIn.cx, clientY - btns.zoomIn.cy) < btns.zoomIn.r) {
    zoomAt(W/2, H/2, cam.zoom * 1.35); return;
  }
  if (Math.hypot(clientX - btns.zoomOut.cx, clientY - btns.zoomOut.cy) < btns.zoomOut.r) {
    zoomAt(W/2, H/2, cam.zoom / 1.35); return;
  }
  if (btns.follow && Math.hypot(clientX - btns.follow.cx, clientY - btns.follow.cy) < btns.follow.r) {
    cam.follow = !cam.follow; sfxClick(); return;
  }
  if (btns.launch && hitRect(clientX, clientY, btns.launch)) {
    setAttackWaypoint(cam.x, cam.y - 300);
    tryLaunchDrone(cam.x, cam.y - 300);
    return;
  }
  if (btns.fire && hitRect(clientX, clientY, btns.fire)) {
    fireAllTurrets(); return;
  }
  if (hitRect(clientX, clientY, btns.menu)) {
    G.screen = 'menu'; sfxClick(); return;
  }

  // Основной тап по миру
  const wp = screenToWorld(clientX, clientY);
  if (G.side === 'attack') {
    if (G.deployed < G.selectedUnits.length) tryLaunchDrone(wp.x, wp.y);
    else setAttackWaypoint(wp.x, wp.y);
  } else {
    if (G.placement.active) tryPlaceTurret(wp.x, wp.y);
    else { setAttackWaypoint; /* noop */ }
  }
}

/* ============================================================
   ВВОД
   ============================================================ */
const pointers = new Map();
let pinchState = null;
function onDown(e) {
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch(_) {}
  pointers.set(e.pointerId, {
    id: e.pointerId, startX: e.clientX, startY: e.clientY,
    x: e.clientX, y: e.clientY, startTime: now(),
    moved: false, wasPan: false, suppressTap: false,
  });
  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    pinchState = {
      dist0: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y),
      zoom0: cam.zoom,
      cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2,
    };
  } else if (pointers.size === 1) {
    if (G.screen === 'battle' && G.side === 'defense' && !G.placement.active) {
      const w = screenToWorld(e.clientX, e.clientY);
      const grabR = 50 / cam.zoom;
      for (const t of G.turrets) {
        if (Math.hypot(t.x - w.x, t.y - w.y) < grabR) {
          G.draggingTurret = t;
          G.dragOffset.x = t.x - w.x; G.dragOffset.y = t.y - w.y;
          break;
        }
      }
    }
  }
}
function onMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(e.clientX - p.startX, e.clientY - p.startY) > 12) p.moved = true;

  if (pointers.size >= 2 && pinchState) {
    const pts = Array.from(pointers.values());
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    if (pinchState.dist0 > 5) {
      zoomAt(pinchState.cx, pinchState.cy, pinchState.zoom0 * (dist / pinchState.dist0));
    }
    return;
  }
  if (G.draggingTurret) {
    const w = screenToWorld(e.clientX, e.clientY);
    G.draggingTurret.x = clamp(w.x + G.dragOffset.x, PLACE_ZONE.x1, PLACE_ZONE.x2);
    G.draggingTurret.y = clamp(w.y + G.dragOffset.y, PLACE_ZONE.y1, PLACE_ZONE.y2);
    return;
  }
  if (p.moved && pointers.size === 1) {
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom; clampCamera();
    if (G.side === 'attack') cam.follow = false;
    p.wasPan = true;
  }
}
function onUp(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  const wasDragging = !!G.draggingTurret;
  if (wasDragging) G.draggingTurret = null;
  if (pointers.size >= 2) return;
  pinchState = null;
  if (pointers.size === 0) {
    if (!p.moved && !p.wasPan && !wasDragging && now() - p.startTime < 500) {
      onTap(e.clientX, e.clientY);
    }
  } else {
    const rem = Array.from(pointers.values())[0];
    rem.suppressTap = true;
  }
}

/* ============================================================
   ДИСПЕТЧЕР ТАПОВ
   ============================================================ */
function onTap(x, y) {
  audioCtx(); // разблокировка звука по первому жесту
  if (G.screen === 'menu')    return tapMenu(x, y);
  if (G.screen === 'campaign')return tapCampaign(x, y);
  if (G.screen === 'briefing')return tapBriefing(x, y);
  if (G.screen === 'upgrades')return tapUpgrades(x, y);
  if (G.screen === 'battle')  return handleBattleTap(x, y);
  if (G.screen === 'victory') return tapVictory(x, y);
}

/* ============================================================
   ЭКРАН: МЕНЮ
   ============================================================ */
function drawMenu() {
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H);

  // Декоративные БПЛА на фоне
  const t = now() / 1000;
  ctx.save(); ctx.globalAlpha = 0.12;
  for (let i = 0; i < 6; i++) {
    const x = ((i * 0.17 + t * 0.04) % 1.3 - 0.15) * W;
    const y = H * 0.10 + i * 45 + Math.sin(t + i) * 14;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.05);
    ctx.fillStyle = '#5ac8ff';
    ctx.beginPath();
    ctx.moveTo(18, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5ac8ff';
  ctx.font = `bold ${Math.min(44, W / 8)}px -apple-system,sans-serif`;
  ctx.fillText('ТИХИЙ УДАР', W / 2, H * 0.18);
  ctx.fillStyle = '#ff8844';
  ctx.font = `bold 18px -apple-system,sans-serif`;
  ctx.fillText('— версия 3.0 —', W / 2, H * 0.18 + 40);

  // Кредиты
  ctx.fillStyle = '#ffcc33';
  ctx.font = 'bold 18px -apple-system,sans-serif';
  ctx.fillText('₽ ' + (Save.credits || 0), W / 2, H * 0.18 + 76);

  const bw = Math.min(340, W * 0.84), bh = 60;
  const bx = (W - bw) / 2;
  const items = [
    { label: 'КАМПАНИЯ',     key: 'campaign', color: '#1d4d7e' },
    { label: 'ПОЛИГОН',      key: 'endless',  color: '#4a3a7e' },
    { label: 'АНГАР',        key: 'upgrades', color: '#2a5a3a' },
    { label: 'НАСТРОЙКИ',    key: 'settings', color: '#3a3a3a' },
  ];
  let y = H * 0.34;
  for (const it of items) {
    ctx.fillStyle = it.color;
    roundRect(ctx, bx, y, bw, bh, 12); ctx.fill();
    ctx.strokeStyle = 'rgba(150,180,210,0.5)'; ctx.lineWidth = 2;
    roundRect(ctx, bx, y, bw, bh, 12); ctx.stroke();
    ctx.fillStyle = '#e8f4ff';
    ctx.font = 'bold 20px -apple-system,sans-serif';
    ctx.fillText(it.label, W / 2, y + bh / 2);
    y += bh + 14;
  }

  ctx.fillStyle = '#4a5560';
  ctx.font = '12px -apple-system,sans-serif';
  ctx.fillText('Сделано для мобильных · без рекламы', W / 2, H - 24);
}
function tapMenu(x, y) {
  const bw = Math.min(340, W * 0.84), bh = 60;
  const bx = (W - bw) / 2;
  let yy = H * 0.34;
  const keys = ['campaign', 'endless', 'upgrades', 'settings'];
  for (let i = 0; i < keys.length; i++) {
    if (x >= bx && x <= bx + bw && y >= yy && y <= yy + bh) {
      sfxClick();
      const k = keys[i];
      if (k === 'campaign') G.screen = 'campaign';
      if (k === 'endless')  startEndless();
      if (k === 'upgrades') G.screen = 'upgrades';
      if (k === 'settings') toggleSettings();
      return;
    }
    yy += bh + 14;
  }
}
function toggleSettings() {
  Save.settings.sound = !Save.settings.sound;
  Save.settings.vibrate = !Save.settings.vibrate;
  setMessage('Звук: ' + (Save.settings.sound ? 'вкл' : 'выкл') +
             ' · Вибро: ' + (Save.settings.vibrate ? 'вкл' : 'выкл'), 1.5);
  commitSave();
  sfxClick();
}

/* ============================================================
   ЭКРАН: КАМПАНИЯ
   ============================================================ */
function drawCampaign() {
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5ac8ff';
  ctx.font = 'bold 26px -apple-system,sans-serif';
  ctx.fillText('Глава 1 · Первые вылеты', W / 2, 60);

  // Сетка 2×3
  const cols = 2, rows = Math.ceil(MISSIONS.length / cols);
  const pad = 20;
  const cw = (W - pad * (cols + 1)) / cols;
  const ch = 110;
  const startY = 110;

  for (let i = 0; i < MISSIONS.length; i++) {
    const m = MISSIONS[i];
    const col = i % cols, row = Math.floor(i / cols);
    const bx = pad + col * (cw + pad);
    const by = startY + row * (ch + pad);
    const stars = Save.stars[m.id] || 0;

    ctx.fillStyle = '#1b2530';
    roundRect(ctx, bx, by, cw, ch, 12); ctx.fill();
    ctx.strokeStyle = stars > 0 ? '#5ac8ff' : 'rgba(120,140,160,0.4)';
    ctx.lineWidth = 2;
    roundRect(ctx, bx, by, cw, ch, 12); ctx.stroke();

    ctx.fillStyle = '#e8f4ff';
    ctx.font = 'bold 15px -apple-system,sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText((i + 1) + '. ' + m.name, bx + 12, by + 24);

    ctx.fillStyle = '#8aa0b0';
    ctx.font = '12px -apple-system,sans-serif';
    const lines = wrapText(m.brief, cw - 24, ctx);
    for (let li = 0; li < Math.min(2, lines.length); li++)
      ctx.fillText(lines[li], bx + 12, by + 46 + li * 15);

    // Звёзды
    ctx.font = 'bold 22px -apple-system,sans-serif';
    ctx.fillStyle = stars > 0 ? '#ffcc33' : 'rgba(120,140,160,0.35)';
    ctx.textAlign = 'left';
    for (let s = 0; s < 3; s++) {
      ctx.fillText('★', bx + 12 + s * 24, by + ch - 18);
    }
    // Кнопка "Играть"
    ctx.fillStyle = '#1d4d7e';
    roundRect(ctx, bx + cw - 92, by + ch - 38, 80, 28, 8); ctx.fill();
    ctx.fillStyle = '#e8f4ff';
    ctx.font = 'bold 13px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ИГРАТЬ', bx + cw - 52, by + ch - 24);

    // Сохраняем для тапа
    m._rect = { x: bx, y: by, w: cw, h: ch, btn: { x: bx + cw - 92, y: by + ch - 38, w: 80, h: 28 } };
  }

  drawBackButton();
}
function wrapText(text, maxW, c) {
  const words = text.split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (c.measureText(test).width > maxW) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}
function tapCampaign(x, y) {
  if (tapBack(x, y)) return;
  for (const m of MISSIONS) {
    if (m._rect && x >= m._rect.btn.x && x <= m._rect.btn.x + m._rect.btn.w &&
        y >= m._rect.btn.y && y <= m._rect.btn.y + m._rect.btn.h) {
      G.pendingMission = m; G.screen = 'briefing'; sfxClick(); return;
    }
  }
}

}
function tapBriefing(x, y) {
  if (tapBack(x, y)) return;

  const bx = (W - bw) / 2;
  if (x >= bx && x <= bx + bw && y >= H - 160 && y <= H - 160 + bh) {
    sfxClick();
    startMission(G.pendingMission);

}

function drawUpgrades() {
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5ac8ff';
  ctx.font = 'bold 22px -apple-system,sans-serif';

  // Атака
  ctx.textAlign = 'left';
  ctx.fillStyle = '#5ac8ff';
  ctx.font = 'bold 15px -apple-system,sans-serif';
  ctx.fillText('АТАКА', 20, 112);
  let y = 134;
  for (const key of Object.keys(ATTACK_UNITS)) {
    y = drawUpgradeRow(key, ATTACK_UNITS[key], y, Save.unlocked.attack[key]);
  }

  ctx.fillStyle = '#ff8844';

  ctx.fillText('ОБОРОНА', 20, y);
  y += 22;
  for (const key of Object.keys(DEFENSE_UNITS)) {
    y = drawUpgradeRow(key, DEFENSE_UNITS[key], y, Save.unlocked.defense[key]);
  }

}
function drawUpgradeRow(key, base, y, unlocked) {
  const lvl = Save.upgrades[key] || 1;
  const max = 5;
  const rowH = 66;
  ctx.fillStyle = unlocked ? '#1b2530' : '#171a1f';
  roundRect(ctx, 14, y, W - 28, rowH, 10); ctx.fill();
  ctx.strokeStyle = unlocked ? 'rgba(90,200,255,0.35)' : 'rgba(120,140,160,0.2)';
  ctx.lineWidth = 1.5;
  roundRect(ctx, 14, y, W - 28, rowH, 10); ctx.stroke();

  ctx.fillStyle = unlocked ? '#e8f4ff' : '#5a6068';
  ctx.font = 'bold 15px -apple-system,sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(base.name + (unlocked ? '' : ' 🔒'), 26, y + 20);
  ctx.font = '12px -apple-system,sans-serif';
  ctx.fillStyle = unlocked ? '#8aa0b0' : '#5a6068';
  ctx.fillText('HP ' + base.hp + (base.damage ? ' · Урон ' + base.damage : '') +
               (base.range ? ' · Дальн. ' + base.range : ''), 26, y + 40);

  // Уровень
  ctx.fillStyle = '#ffcc33';
  ctx.font = 'bold 14px -apple-system,sans-serif';
  ctx.fillText('Ур. ' + lvl + '/' + max, 26, y + 58);

  // Кнопка +
  const cost = (lvl + 1) * 100;
  const canUp = unlocked && lvl < max && (Save.credits || 0) >= cost;
  const btn = { x: W - 96, y: y + 18, w: 82, h: 32 };
  ctx.fillStyle = canUp ? '#2a5a3a' : '#2a2f36';
  roundRect(ctx, btn.x, btn.y, btn.w, btn.h, 8); ctx.fill();
  ctx.strokeStyle = canUp ? '#66cc88' : 'rgba(120,140,160,0.35)';
  ctx.stroke();
  ctx.fillStyle = canUp ? '#e8ffe8' : '#6a7078';
  ctx.font = 'bold 12px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(lvl < max ? ('₽ ' + cost) : 'MAX', btn.x + btn.w / 2, btn.y + btn.h / 2);

  base._btn = { ...btn, key, cost, canUp, lvl, max };
  return y + rowH + 8;
}
function tapUpgrades(x, y) {
  if (tapBack(x, y)) return;
  const all = { ...ATTACK_UNITS, ...DEFENSE_UNITS };
  for (const k of Object.keys(all)) {
    const b = all[k]._btn;
    if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.canUp) {
        Save.credits -= b.cost;
        Save.upgrades[b.key] = b.lvl + 1;
        commitSave();
        sfxWin();
      } else sfxClick();
      return;
    }
  }
}

/* ============================================================
   ЭКРАН: ПОБЕДА / ПОРАЖЕНИЕ

function drawVictory() {
  ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const win = G.result === 'win';
  ctx.fillStyle = win ? '#44dd66' : '#ff4444';
  ctx.shadowColor = win ? '#44dd66' : '#ff4444';
  ctx.shadowBlur = 22;
  ctx.font = `bold ${Math.min(52, W / 7)}px -apple-system,sans-serif`;
  ctx.fillText(win ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ', W / 2, H * 0.28);
  ctx.shadowBlur = 0;

  if (G.mission && G.mission.id === 'endless') {
    ctx.fillStyle = '#aab';
    ctx.font = '18px -apple-system,sans-serif';
    ctx.fillText('Волн пройдено: ' + G.endlessWave, W / 2, H * 0.28 + 60);
    ctx.fillStyle = '#ffcc33';
    ctx.fillText('Рекорд: ' + (Save.endlessBest || 0), W / 2, H * 0.28 + 90);
  } else if (win && G.lastReward) {
    // Звёзды
    ctx.font = 'bold 40px -apple-system,sans-serif';
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < G.lastReward.stars ? '#ffcc33' : 'rgba(120,140,160,0.35)';
      ctx.fillText('★', W / 2 - 60 + i * 60, H * 0.28 + 60);
    }
    ctx.fillStyle = '#ffcc33';
    ctx.font = 'bold 20px -apple-system,sans-serif';
    ctx.fillText('+ ₽ ' + G.lastReward.credits, W / 2, H * 0.28 + 120);
  }

  // Кнопки: ещё раз / в кампанию / в меню
  const bw = Math.min(320, W * 0.72), bh = 58;

  const by1 = H * 0.58, by2 = by1 + bh + 14, by3 = by2 + bh + 14;
  drawBtn(bx, by1, bw, bh, 'ПОВТОРИТЬ', '#1d4d7e');
  drawBtn(bx, by2, bw, bh, 'К КАРТЕ',   '#2a5a3a');
  drawBtn(bx, by3, bw, bh, 'В МЕНЮ',    '#3a3a3a');
  G._btnRepeat = { x: bx, y: by1, w: bw, h: bh };
  G._btnMap    = { x: bx, y: by2, w: bw, h: bh };
  G._btnMenu   = { x: bx, y: by3, w: bw, h: bh };
}
function drawBtn(x, y, w, h, label, color) {
  ctx.fillStyle = color;
  roundRect(ctx, x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,210,0.5)'; ctx.lineWidth = 2;
  roundRect(ctx, x, y, w, h, 12); ctx.stroke();
  ctx.fillStyle = '#e8f4ff';
  ctx.font = 'bold 18px -apple-system,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w/2, y + h/2);
}
function tapVictory(x, y) {
  if (hitRect(x, y, G._btnRepeat)) {
    sfxClick();
    if (G.mission.id === 'endless') startEndless();
    else startMission(G.mission);
    return;
  }
  if (hitRect(x, y, G._btnMap)) {
    sfxClick(); G.screen = 'campaign'; return;
  }
  if (hitRect(x, y, G._btnMenu)) {
    sfxClick(); G.screen = 'menu'; return;
  }
}

function drawBackButton() {

/* ============================================================
   ОТРИСОВКА БОЯ
   ============================================================ */
function drawTerrain() {
  const b = visibleBounds();
  ctx.fillStyle = '#28361b';
  ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);

  for (const f of terrain.fields) {
    if (f.x + f.w < b.x1 || f.x > b.x2 || f.y + f.h < b.y1 || f.y > b.y2) continue;
    ctx.fillStyle = f.color; ctx.fillRect(f.x, f.y, f.w, f.h);
  }
  for (const p of terrain.parks) {
    if (p.x + p.w < b.x1 || p.x > b.x2 || p.y + p.h < b.y1 || p.y > b.y2) continue;
    ctx.fillStyle = '#294519'; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.strokeStyle = 'rgba(120,180,90,0.3)'; ctx.lineWidth = 2;
    ctx.strokeRect(p.x, p.y, p.w, p.h);
  }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(terrain.riverPts[0].x, terrain.riverPts[0].y);
  for (let i = 1; i < terrain.riverPts.length; i++)
    ctx.lineTo(terrain.riverPts[i].x, terrain.riverPts[i].y);
  ctx.strokeStyle = '#1f3a55'; ctx.lineWidth = 90; ctx.stroke();
  ctx.strokeStyle = '#2f4f70'; ctx.lineWidth = 65; ctx.stroke();
  ctx.strokeStyle = 'rgba(140,200,240,0.15)'; ctx.lineWidth = 20; ctx.stroke();

  for (const r of terrain.roads) {
    ctx.strokeStyle = r.major ? '#3a3a3a' : '#323232';
    ctx.lineWidth = r.w; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2); ctx.stroke();
  }
  for (const r of terrain.roads) {
    if (!r.major) continue;
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 3;
    ctx.setLineDash([24, 34]);
    ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2); ctx.stroke();
  }
  ctx.setLineDash([]);

  for (const bd of terrain.buildings) {
    if (bd.x + bd.w < b.x1 - 5 || bd.x > b.x2 + 5 ||
        bd.y + bd.h < b.y1 - 5 || bd.y > b.y2 + 5) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(bd.x + 5, bd.y + 5, bd.w, bd.h);
    const s = bd.shade;
    if (bd.type === 'tall')
      ctx.fillStyle = `rgb(${(70*s)|0},${(78*s)|0},${(92*s)|0})`;
    else
      ctx.fillStyle = `rgb(${(92*s)|0},${(88*s)|0},${(82*s)|0})`;
    ctx.fillRect(bd.x, bd.y, bd.w, bd.h);
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    ctx.fillRect(bd.x + 7, bd.y + 7, bd.w - 14, bd.h - 14);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = Math.max(0.8, 1.5 / cam.zoom);
    ctx.strokeRect(bd.x, bd.y, bd.w, bd.h);
  }
  for (const t of terrain.trees) {
    if (t.x + t.r < b.x1 - 5 || t.x - t.r > b.x2 + 5 ||
        t.y + t.r < b.y1 - 5 || t.y - t.r > b.y2 + 5) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(t.x + 3, t.y + 4, t.r, 0, Math.PI * 2); ctx.fill();
    const s = t.shade;
    ctx.fillStyle = `rgb(${(42*s)|0},${(96*s)|0},${(38*s)|0})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(150,210,110,${0.28*s})`;
    ctx.beginPath(); ctx.arc(t.x - t.r*0.3, t.y - t.r*0.3, t.r*0.6, 0, Math.PI*2); ctx.fill();
  }
}

function drawUAV(x, y, angle, size, isPlayer, hitFlash, hpRatio, typeKey) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.fillStyle = 'rgba(120,200,255,0.45)';
  ctx.beginPath(); ctx.ellipse(-size*1.25, 0, size*0.7, size*0.2, 0, 0, Math.PI*2); ctx.fill();

  let base = isPlayer ? '#8aa0b8' : '#b89a8a';
  if (typeKey === 'heavy') base = isPlayer ? '#7a6a4a' : '#a08a6a';
  if (typeKey === 'jammer') base = '#6ac8a0';
  if (typeKey === 'scout') base = '#a0a0b8';
  const dark = '#2a3a4a';
  const body = hitFlash > 0 ? '#ffffff' : base;

  ctx.fillStyle = body; ctx.strokeStyle = dark;
  ctx.lineWidth = Math.max(1, 1.6 / cam.zoom);
  ctx.beginPath();
  ctx.moveTo(size*1.15, 0);
  ctx.lineTo(-size*0.4, -size*1.05);
  ctx.lineTo(-size*0.85, -size*0.35);
  ctx.lineTo(-size*0.85, size*0.35);
  ctx.lineTo(-size*0.4, size*1.05);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = Math.max(1, 1 / cam.zoom);
  ctx.beginPath(); ctx.moveTo(size*0.9, 0); ctx.lineTo(-size*0.6, 0); ctx.stroke();

  ctx.fillStyle = hitFlash > 0 ? '#ffcc33' : (isPlayer ? '#3a7ec8' : '#c84a3a');
  ctx.beginPath(); ctx.arc(size*0.85, 0, size*0.2, 0, Math.PI*2); ctx.fill();

  if (typeKey === 'jammer') {
    ctx.strokeStyle = `rgba(100,255,180,${0.3 + 0.3*Math.sin(now()/120)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, size*1.6, 0, Math.PI*2); ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(230,230,230,0.75)';
  ctx.lineWidth = Math.max(1, 1.5 / cam.zoom);
  const pA = (now()/25) % (Math.PI*2);
  const pLen = Math.abs(Math.cos(pA)) * size * 0.55;
  ctx.beginPath(); ctx.moveTo(-size*1.05, -pLen); ctx.lineTo(-size*1.05, pLen); ctx.stroke();
  ctx.restore();

  if (hpRatio < 1) {
    const bw = 34;
    const bh = 4;
    const y0 = y - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(x - bw/2, y0, bw, bh);
    ctx.fillStyle = hpRatio > 0.5 ? '#44dd66' : (hpRatio > 0.25 ? '#ffaa33' : '#ff4444');
    ctx.fillRect(x - bw/2, y0, bw * hpRatio, bh);
  }
}

function drawTurret(t) {
  ctx.beginPath();
  ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
  ctx.fillStyle = t.jamTime > 0 ? 'rgba(100,255,180,0.08)' : 'rgba(255,140,70,0.05)';
  ctx.fill();
  ctx.strokeStyle = t.jamTime > 0 ? 'rgba(100,255,180,0.5)' : 'rgba(255,140,70,0.3)';
  ctx.lineWidth = Math.max(1, 1.5 / cam.zoom);
  ctx.setLineDash([10, 10]); ctx.stroke(); ctx.setLineDash([]);

  ctx.save(); ctx.translate(t.x, t.y);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(-16, -11, 40, 30);
  ctx.fillStyle = '#3a4048';
  ctx.fillRect(-20, -15, 40, 30);
  ctx.strokeStyle = '#5a6068';
  ctx.lineWidth = Math.max(1, 1.5 / cam.zoom);
  ctx.strokeRect(-20, -15, 40, 30);
  ctx.fillStyle = '#101418';
  ctx.fillRect(-18, -19, 9, 5); ctx.fillRect(9, -19, 9, 5);
  ctx.fillRect(-18, 14, 9, 5);  ctx.fillRect(9, 14, 9, 5);
  ctx.fillStyle = '#2a3038';
  ctx.fillRect(-16, -10, 12, 20);

  ctx.fillStyle = '#2a3038';
  ctx.beginPath(); ctx.arc(2, 0, 12, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#4a5058'; ctx.stroke();
  ctx.save(); ctx.rotate(t.angle);
  ctx.fillStyle = '#6a7278'; ctx.fillRect(0, -3, 30, 6);
  ctx.fillStyle = '#8a9298'; ctx.fillRect(26, -3, 5, 6);
  ctx.restore();
  ctx.restore();

  if (t.cooldown > 0) {
    const prog = 1 - t.cooldown / t.maxCooldown;
    ctx.strokeStyle = 'rgba(255,210,80,0.85)';
    ctx.lineWidth = Math.max(2, 3 / cam.zoom);
    ctx.beginPath();
    ctx.arc(t.x, t.y, 26, -Math.PI/2, -Math.PI/2 + Math.PI*2*prog);
    ctx.stroke();
  }
}

function drawTarget() {
  const t = G.target; if (!t) return;
  const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.radius*1.7);
  g.addColorStop(0, 'rgba(255,70,70,0.20)');
  g.addColorStop(1, 'rgba(255,70,70,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(t.x, t.y, t.radius*1.7, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#26161a'; ctx.strokeStyle = '#c04040';
  ctx.lineWidth = Math.max(2, 3 / cam.zoom);
  ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(t.x, t.y, t.radius*0.55, 0, Math.PI*2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,80,80,0.85)';
  const k = t.radius * 0.85;
  ctx.beginPath();
  ctx.moveTo(t.x - k, t.y); ctx.lineTo(t.x + k, t.y);
  ctx.moveTo(t.x, t.y - k); ctx.lineTo(t.x, t.y + k);
  ctx.stroke();

  const bw = t.radius * 2.2, bh = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(t.x - bw/2, t.y - t.radius - 30, bw, bh);
  const p = clamp(t.hp / t.maxHp, 0, 1);
  ctx.fillStyle = p > 0.5 ? '#ff4444' : (p > 0.25 ? '#ff8844' : '#ffcc33');
  ctx.fillRect(t.x - bw/2 + 1, t.y - t.radius - 29, (bw - 2) * p, bh - 2);
}

function drawWorld() {
  ctx.save(); applyCamera();
  drawTerrain();
  drawTarget();

  if (G.side === 'defense' && G.placement.active) {
    ctx.fillStyle = 'rgba(90,200,255,0.06)';
    ctx.fillRect(PLACE_ZONE.x1, PLACE_ZONE.y1,
                 PLACE_ZONE.x2 - PLACE_ZONE.x1, PLACE_ZONE.y2 - PLACE_ZONE.y1);
    ctx.strokeStyle = 'rgba(90,200,255,0.45)';
    ctx.setLineDash([14, 10]);
    ctx.lineWidth = Math.max(1.5, 2 / cam.zoom);
    ctx.strokeRect(PLACE_ZONE.x1, PLACE_ZONE.y1,
                   PLACE_ZONE.x2 - PLACE_ZONE.x1, PLACE_ZONE.y2 - PLACE_ZONE.y1);
    ctx.setLineDash([]);
  }

  for (const t of G.turrets) drawTurret(t);

  ctx.lineWidth = Math.max(1.5, 2 / cam.zoom);
  for (const tr of G.tracers) {
    ctx.globalAlpha = clamp(tr.life / tr.maxLife, 0, 1);
    ctx.strokeStyle = tr.color;
    ctx.beginPath(); ctx.moveTo(tr.x1, tr.y1); ctx.lineTo(tr.x2, tr.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const d of G.drones) {
    if (!d.alive) continue;
    const bob = Math.sin(d.bob) * 1.5;
    drawUAV(d.x, d.y + bob, d.angle, 18, d.player, d.hitFlash, d.hp / d.maxHp, d.typeKey);
  }
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Цифры урона
  ctx.font = 'bold 16px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  for (const dt of G.dmgTexts) {
    ctx.globalAlpha = clamp(dt.life / dt.maxLife, 0, 1);
    ctx.fillStyle = dt.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeText('-'+dt.val, dt.x, dt.y);
    ctx.fillText('-'+dt.val, dt.x, dt.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

/* ============================================================
   МИНИ-КАРТА
   ============================================================ */
function drawMinimap() {
  const mmW = 90;
  const mmH = mmW * (WORLD_H / WORLD_W);
  const mmX = W - mmW - 14;
  const mmY = 62;
  ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(10,14,20,0.85)';
  roundRect(ctx, mmX, mmY, mmW, mmH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(120,150,180,0.5)'; ctx.lineWidth = 1;
  roundRect(ctx, mmX, mmY, mmW, mmH, 6); ctx.stroke();
  const sx = mmW / WORLD_W, sy = mmH / WORLD_H;
  ctx.strokeStyle = 'rgba(80,140,200,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < terrain.riverPts.length; i++) {
    const p = terrain.riverPts[i];
    if (i === 0) ctx.moveTo(mmX + p.x*sx, mmY + p.y*sy);
    else         ctx.lineTo(mmX + p.x*sx, mmY + p.y*sy);
  }
  ctx.stroke();
  if (G.target) {
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(mmX + G.target.x*sx, mmY + G.target.y*sy, 3, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#ff8844';
  for (const t of G.turrets) ctx.fillRect(mmX + t.x*sx - 1.5, mmY + t.y*sy - 1.5, 3, 3);
  for (const d of G.drones) {
    if (!d.alive) continue;
    ctx.fillStyle = d.player ? '#5ac8ff' : '#ffaa33';
    ctx.beginPath(); ctx.arc(mmX + d.x*sx, mmY + d.y*sy, 2, 0, Math.PI*2); ctx.fill();
  }
  const halfW = W/2/cam.zoom, halfH = H/2/cam.zoom;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  ctx.strokeRect(mmX + clamp(cam.x - halfW, 0, WORLD_W)*sx,
                 mmY + clamp(cam.y - halfH, 0, WORLD_H)*sy,
                 Math.min(halfW*2, WORLD_W)*sx,
                 Math.min(halfH*2, WORLD_H)*sy);
  ctx.restore();
}

/* ============================================================
   HUD БОЯ
   ============================================================ */
function drawBattleHUD() {
  // Верхняя панель
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 52);
  ctx.font = 'bold 15px -apple-system,sans-serif';
  ctx.textBaseline = 'middle';

  const alive = G.drones.filter(d => d.alive).length;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  let left;
  if (G.side === 'attack') {
    left = `БПЛА: ${alive}/${G.selectedUnits.length} · готово ${G.deployed}`;
  } else {
    left = `Целей: ${alive + (G.spawnQueue > 100 ? 0 : G.spawnQueue)}`;
  }
  ctx.fillText(left, 100, 26);

  ctx.textAlign = 'right';
  ctx.fillStyle = G.side === 'attack' ? '#5ac8ff' : '#ff8844';
  ctx.fillText(G.side === 'attack' ? 'АТАКА' : 'ОБОРОНА', W - 16, 26);

  // HP цели
  if (G.target) {
    const bw = W * 0.55, bx = 16, by = 46;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, bx, by, bw, 8, 4); ctx.fill();
    const p = clamp(G.target.hp / G.target.maxHp, 0, 1);
    ctx.fillStyle = G.side === 'attack' ? '#ff5555' : '#44dd66';
    roundRect(ctx, bx + 1, by + 1, (bw - 2) * p, 6, 3); ctx.fill();
  }

  // Кнопки
  const btns = getBattleUI();
  ctx.textAlign = 'center';
  // Зум-кнопки
  for (const k of ['zoomIn','zoomOut','follow']) {
    const b = btns[k]; if (!b) continue;
    const active = k === 'follow' && cam.follow;
    ctx.fillStyle = active ? 'rgba(90,200,255,0.35)' : 'rgba(20,30,40,0.75)';
    ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = active ? '#5ac8ff' : 'rgba(150,180,210,0.6)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#e8f4ff';
    ctx.font = 'bold 22px -apple-system,sans-serif';
    let label = k === 'zoomIn' ? '+' : k === 'zoomOut' ? '−' : '◎';
    ctx.fillText(label, b.cx, b.cy + 1);
  }
  // Кнопка запуска/огня
  if (btns.launch) {
    const can = G.deployed < G.selectedUnits.length;
    ctx.fillStyle = can ? '#2a5a3a' : '#2a2f36';
    roundRect(ctx, btns.launch.x, btns.launch.y, btns.launch.w, btns.launch.h, 12); ctx.fill();
    ctx.strokeStyle = can ? '#66cc88' : 'rgba(120,140,160,0.35)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = can ? '#e8ffe8' : '#6a7078';
    ctx.font = 'bold 16px -apple-system,sans-serif';
    const nk = G.selectedUnits[G.deployed];
    const label = can ? ('▶ ' + (nk ? ATTACK_UNITS[nk].name : '')) : 'ВСЕ ВЫПУЩЕНЫ';
    ctx.fillText(label, btns.launch.x + btns.launch.w/2, btns.launch.y + btns.launch.h/2);
  }
  if (btns.fire) {
    ctx.fillStyle = '#7a3a16';
    roundRect(ctx, btns.fire.x, btns.fire.y, btns.fire.w, btns.fire.h, 12); ctx.fill();
    ctx.strokeStyle = '#ff8844'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffeee0';
    ctx.font = 'bold 16px -apple-system,sans-serif';
    ctx.fillText('🔥 ОГОНЬ', btns.fire.x + btns.fire.w/2, btns.fire.y + btns.fire.h/2);
  }
  // Кнопка "Назад"
  const m = btns.menu;
  ctx.fillStyle = 'rgba(20,30,45,0.85)';
  roundRect(ctx, m.x, m.y, m.w, m.h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,210,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e8f4ff';
  ctx.font = 'bold 13px -apple-system,sans-serif';
  ctx.fillText('‹ МЕНЮ', m.x + m.w/2, m.y + m.h/2);

  // Сообщение
  if (G.messageTime > 0) {
    ctx.globalAlpha = clamp(G.messageTime, 0, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffeebb';
    ctx.font = 'bold 16px -apple-system,sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6;
    ctx.fillText(G.message, W/2, H - 120);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (G.screenFlash > 0) {
    ctx.globalAlpha = G.screenFlash * 1.5;
    ctx.fillStyle = '#ff8844';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  drawMinimap();
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
let lastT = 0;
function loop(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.1) dt = 0.1;

  update(dt);
  ctx.clearRect(0, 0, W, H);

  if (G.screen === 'menu')         drawMenu();
  else if (G.screen === 'campaign')drawCampaign();
  else if (G.screen === 'briefing')drawBriefing();
  else if (G.screen === 'upgrades')drawUpgrades();
  else if (G.screen === 'battle')  { drawWorld(); drawBattleHUD(); }
  else if (G.screen === 'victory') { drawWorld(); drawBattleHUD(); drawVictory(); }

  requestAnimationFrame(loop);
}

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
loadSave();
generateTerrain();
requestAnimationFrame(loop);

document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastT = 0; });
cvs.addEventListener('pointerdown', onDown, { passive: false });
cvs.addEventListener('pointermove', onMove, { passive: false });
cvs.addEventListener('pointerup',   onUp,   { passive: false });
cvs.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); G.draggingTurret = null; });
</script>
