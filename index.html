<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e14">
<title>Тихий удар 4.0</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0e14;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;overscroll-behavior:none}
  canvas{display:block;position:absolute;top:0;left:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

/* ============================================================
   1. КОНСТАНТЫ
   ============================================================ */
const WORLD_W = 4000;
const WORLD_H = 7000;
const TARGET_X = 2000;
const TARGET_Y = 800;
const TARGET_R = 130;
const PLACE_ZONE = { x1: 200, y1: 2000, x2: WORLD_W - 200, y2: WORLD_H - 200 };

/* ============================================================
   2. CANVAS
   ============================================================ */
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.floor(W * dpr); cvs.height = Math.floor(H * dpr);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

/* ============================================================
   3. УТИЛИТЫ
   ============================================================ */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const now = () => performance.now();
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
let _seed = 1;
function seedRand(s) { _seed = s | 0; }
function rnd() { _seed = (_seed * 1664525 + 1013904223) | 0; return ((_seed >>> 0) / 4294967296); }
function rr(a, b) { return a + rnd() * (b - a); }

/* ============================================================
   4. СОХРАНЕНИЕ
   ============================================================ */
const SAVE_KEY = 'tihiy-udar-save-v4';
const DEFAULT_SAVE = {
  version: 4,
  credits: 0,
  stars: {},
  upgrades: { kamikaze: 1, heavy: 1, jammer: 1, pkt: 1, zu23: 1, igla: 1 },
  unlocked: {
    attack: { kamikaze: true, heavy: false, jammer: false },
    defense: { pkt: true, zu23: false, igla: false },
  },
  settings: { sound: true, vibrate: true },
  opBest: 0,
};
let Save = JSON.parse(JSON.stringify(DEFAULT_SAVE));
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      Save = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SAVE)), o);
      Save.upgrades = Object.assign({}, DEFAULT_SAVE.upgrades, o.upgrades || {});
      Save.unlocked.attack = Object.assign({}, DEFAULT_SAVE.unlocked.attack, (o.unlocked || {}).attack || {});
      Save.unlocked.defense = Object.assign({}, DEFAULT_SAVE.unlocked.defense, (o.unlocked || {}).defense || {});
      Save.settings = Object.assign({}, DEFAULT_SAVE.settings, o.settings || {});
    }
  } catch (e) {}
}
function commitSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(Save)); } catch (e) {} }

/* ============================================================
   5. ЗВУК
   ============================================================ */
let actx = null;
function audioCtx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return actx;
}
function beep(freq, dur, type, vol) {
  if (!Save.settings.sound) return;
  const a = audioCtx(); if (!a) return;
  try {
    const o = a.createOscillator(); const g = a.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function noise(dur, vol) {
  if (!Save.settings.sound) return;
  const a = audioCtx(); if (!a) return;
  try {
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol || 0.12;
    src.connect(g); g.connect(a.destination); src.start();
  } catch (e) {}
}
function vibrate(ms) { if (!Save.settings.vibrate) return; if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }
function sfxShot() { beep(720, 0.03, 'square', 0.025); }
function sfxHit() { beep(220, 0.06, 'sawtooth', 0.04); vibrate(12); }
function sfxExplode() { noise(0.35, 0.15); beep(90, 0.4, 'sawtooth', 0.06); vibrate(55); }
function sfxClick() { beep(520, 0.04, 'sine', 0.04); }
function sfxWin() { beep(660, 0.12, 'sine', 0.06); setTimeout(() => beep(880, 0.12, 'sine', 0.06), 120); setTimeout(() => beep(1100, 0.22, 'sine', 0.07), 260); }
function sfxLose() { beep(220, 0.2, 'sine', 0.05); setTimeout(() => beep(150, 0.35, 'sine', 0.05), 180); }
function sfxMG() { noise(0.06, 0.08); beep(320, 0.04, 'square', 0.03); }

/* ============================================================
   6. КАМЕРА (для вида сверху)
   ============================================================ */
const cam = {
  x: TARGET_X, y: WORLD_H - 800, zoom: 0.7, targetZoom: 0.7,
  minZoom: 0.15, maxZoom: 2.5, follow: false,
  shakeX: 0, shakeY: 0, shakeMag: 0, shakeTime: 0,
};
function applyCamera() {
  ctx.translate(W / 2 + cam.shakeX, H / 2 + cam.shakeY);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(-cam.x, -cam.y);
}
function screenToWorld(sx, sy) {
  return { x: (sx - W / 2 - cam.shakeX) / cam.zoom + cam.x,
           y: (sy - H / 2 - cam.shakeY) / cam.zoom + cam.y };
}
function zoomAt(sx, sy, nz) {
  nz = clamp(nz, cam.minZoom, cam.maxZoom);
  const b = screenToWorld(sx, sy);
  cam.zoom = nz; cam.targetZoom = nz;
  const a = screenToWorld(sx, sy);
  cam.x += b.x - a.x; cam.y += b.y - a.y;
  clampCamera();
}
function clampCamera() {
  const hw = W / 2 / cam.zoom, hh = H / 2 / cam.zoom;
  cam.x = (hw * 2 < WORLD_W) ? clamp(cam.x, hw, WORLD_W - hw) : WORLD_W / 2;
  cam.y = (hh * 2 < WORLD_H) ? clamp(cam.y, hh, WORLD_H - hh) : WORLD_H / 2;
}
function visibleBounds() {
  const tl = screenToWorld(0, 0), br = screenToWorld(W, H);
  return { x1: tl.x, y1: tl.y, x2: br.x, y2: br.y };
}
function shakeCamera(mag, time) {
  cam.shakeMag = Math.max(cam.shakeMag, mag);
  cam.shakeTime = Math.max(cam.shakeTime, time);
}

/* ============================================================
   7. МЕСТНОСТЬ + РАНДОМНЫЕ ДОРОГИ-ПОЛИЛИНИИ
   ============================================================ */
const terrain = {
  river: [],
  roads: [],       // каждый: {pts:[{x,y}...], w, major, name}
  buildings: [],
  trees: [],
  parks: [],
  fields: [],
};

/* Расстояние от точки до полилинии (приближённо — до сегментов) */
function distToPolyline(px, py, pts) {
  let best = Infinity;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((px - a.x) * dx + (py - a.y) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const qx = a.x + dx * t, qy = a.y + dy * t;
    const d = Math.hypot(px - qx, py - qy);
    if (d < best) best = d;
  }
  return best;
}
function distToAnyRoad(px, py) {
  let best = Infinity;
  for (const r of terrain.roads) {
    const d = distToPolyline(px, py, r.pts);
    if (d < best) best = d;
  }
  return best;
}

function generateTerrain() {
  seedRand(20260226);
  terrain.river.length = 0;
  terrain.roads.length = 0;
  terrain.buildings.length = 0;
  terrain.trees.length = 0;
  terrain.parks.length = 0;
  terrain.fields.length = 0;

  /* --- Река: извилистая, вертикальная, слева --- */
  let rx = 900;
  for (let y = -200; y <= WORLD_H + 200; y += 130) {
    rx += rr(-80, 80);
    rx = clamp(rx, 500, 1400);
    terrain.river.push({ x: rx, y });
  }

  /* --- Рандомные дороги-полилинии --- */
  // Магистрали (горизонтальные)
  const hYs = [700, 1700, 2700, 3800, 4900, 6000];
  for (const baseY of hYs) {
    const pts = [];
    const segs = 10;
    let y = baseY;
    for (let i = 0; i <= segs; i++) {
      const x = (i / segs) * WORLD_W;
      y += rr(-100, 100);
      pts.push({ x, y });
    }
    terrain.roads.push({ pts, w: 90, major: true });
  }
  // Магистрали (вертикальные)
  const vXs = [700, 1500, 2400, 3300];
  for (const baseX of vXs) {
    const pts = [];
    const segs = 12;
    let x = baseX;
    for (let i = 0; i <= segs; i++) {
      const y = (i / segs) * WORLD_H;
      x += rr(-90, 90);
      pts.push({ x, y });
    }
    terrain.roads.push({ pts, w: 90, major: true });
  }
  // Второстепенные улицы (короткие, между магистралями)
  for (let i = 0; i < 26; i++) {
    const isH = rnd() < 0.5;
    if (isH) {
      const y = rr(400, WORLD_H - 400);
      const x1 = rr(0, WORLD_W - 800);
      const x2 = x1 + rr(400, 1200);
      const pts = [];
      let yy = y;
      for (let s = 0; s <= 4; s++) {
        pts.push({ x: x1 + (x2 - x1) * (s / 4), y: yy });
        yy += rr(-60, 60);
      }
      terrain.roads.push({ pts, w: 40, major: false });
    } else {
      const x = rr(400, WORLD_W - 400);
      const y1 = rr(0, WORLD_H - 800);
      const y2 = y1 + rr(400, 1200);
      const pts = [];
      let xx = x;
      for (let s = 0; s <= 4; s++) {
        pts.push({ x: xx, y: y1 + (y2 - y1) * (s / 4) });
        xx += rr(-60, 60);
      }
      terrain.roads.push({ pts, w: 40, major: false });
    }
  }

  /* --- Поля (фоновые пятна) --- */
  for (let i = 0; i < 40; i++) {
    terrain.fields.push({
      x: rr(0, WORLD_W - 700), y: rr(0, WORLD_H - 700),
      w: rr(400, 900), h: rr(400, 900),
      color: rnd() < 0.5 ? '#2e3d20' : '#3a4526',
    });
  }

  /* --- Парки / леса (крупные массивы) --- */
  for (let i = 0; i < 14; i++) {
    terrain.parks.push({
      x: rr(150, WORLD_W - 800), y: rr(200, WORLD_H - 800),
      w: rr(400, 900), h: rr(400, 900),
    });
  }

  /* --- Здания: вдоль дорог, блоками --- */
  const cityZones = [
    { x1: 1500, y1: 400, x2: 2600, y2: 1400, d: 90 },   // город у цели
    { x1: 500, y1: 2200, x2: 1800, y2: 3200, d: 70 },
    { x1: 2200, y1: 2400, x2: 3600, y2: 3400, d: 70 },
    { x1: 800, y1: 4400, x2: 2200, y2: 5400, d: 60 },
    { x1: 2400, y1: 4600, x2: 3700, y2: 5800, d: 60 },
    { x1: 1200, y1: 6000, x2: 3000, y2: 6800, d: 55 },
  ];
  for (const z of cityZones) {
    for (let i = 0; i < z.d; i++) {
      const bw = rr(70, 180), bh = rr(70, 180);
      const bx = rr(z.x1, z.x2 - bw), by = rr(z.y1, z.y2 - bh);
      const cx = bx + bw / 2, cy = by + bh / 2;
      if (distToAnyRoad(cx, cy) < 60) continue;
      if (distToAnyRoad(cx, cy) > 500) continue;
      // не на реке
      let onRiver = false;
      for (let ri = 0; ri < terrain.river.length - 1; ri++) {
        const a = terrain.river[ri], b = terrain.river[ri + 1];
        if (cy >= a.y && cy <= b.y) {
          const t = (cy - a.y) / (b.y - a.y);
          const rxc = a.x + (b.x - a.x) * t;
          if (Math.abs(cx - rxc) < 130) onRiver = true;
          break;
        }
      }
      if (onRiver) continue;
      terrain.buildings.push({
        x: bx, y: by, w: bw, h: bh,
        type: rnd() < 0.4 ? 'tall' : 'low',
        shade: rr(0.65, 1.05),
      });
    }
  }

  /* --- Деревья --- */
  for (let i = 0; i < 2600; i++) {
    const tx = rr(40, WORLD_W - 40);
    const ty = rr(40, WORLD_H - 40);
    // не на дорогах
    if (distToAnyRoad(tx, ty) < 55) continue;
    // не на зданиях
    let skip = false;
    for (const b of terrain.buildings) {
      if (tx > b.x - 25 && tx < b.x + b.w + 25 &&
          ty > b.y - 25 && ty < b.y + b.h + 25) { skip = true; break; }
    }
    if (skip) continue;
    terrain.trees.push({ x: tx, y: ty, r: rr(14, 28), shade: rr(0.5, 1.0) });
  }
}

function drawTerrain() {
  const b = visibleBounds();
  // База — зелёный луг
  ctx.fillStyle = '#28361b';
  ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);

  // Поля
  for (const f of terrain.fields) {
    if (f.x + f.w < b.x1 || f.x > b.x2 || f.y + f.h < b.y1 || f.y > b.y2) continue;
    ctx.fillStyle = f.color;
    ctx.fillRect(f.x, f.y, f.w, f.h);
  }
  // Парки
  for (const p of terrain.parks) {
    if (p.x + p.w < b.x1 || p.x > b.x2 || p.y + p.h < b.y1 || p.y > b.y2) continue;
    ctx.fillStyle = '#1f3a13';
    ctx.fillRect(p.x, p.y, p.w, p.h);
  }
  // Река
  if (terrain.river.length > 1) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(terrain.river[0].x, terrain.river[0].y);
    for (let i = 1; i < terrain.river.length; i++)
      ctx.lineTo(terrain.river[i].x, terrain.river[i].y);
    ctx.strokeStyle = '#1f3a55'; ctx.lineWidth = 170; ctx.stroke();
    ctx.strokeStyle = '#2f4f70'; ctx.lineWidth = 130; ctx.stroke();
    ctx.strokeStyle = 'rgba(140,200,240,0.13)'; ctx.lineWidth = 40; ctx.stroke();
  }
  // Дороги
  for (const r of terrain.roads) {
    // фон обочины
    ctx.strokeStyle = r.major ? '#2a2a2a' : '#252525';
    ctx.lineWidth = r.w + 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(r.pts[0].x, r.pts[0].y);
    for (let i = 1; i < r.pts.length; i++) ctx.lineTo(r.pts[i].x, r.pts[i].y);
    ctx.stroke();
    // асфальт
    ctx.strokeStyle = r.major ? '#3a3a3a' : '#333';
    ctx.lineWidth = r.w;
    ctx.stroke();
  }
  // Разметка магистралей
  for (const r of terrain.roads) {
    if (!r.major) continue;
    ctx.strokeStyle = 'rgba(240,220,120,0.28)';
    ctx.lineWidth = 3;
    ctx.setLineDash([30, 44]);
    ctx.beginPath();
    ctx.moveTo(r.pts[0].x, r.pts[0].y);
    for (let i = 1; i < r.pts.length; i++) ctx.lineTo(r.pts[i].x, r.pts[i].y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Здания
  for (const bd of terrain.buildings) {
    if (bd.x + bd.w < b.x1 - 10 || bd.x > b.x2 + 10 ||
        bd.y + bd.h < b.y1 - 10 || bd.y > b.y2 + 10) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(bd.x + 7, bd.y + 7, bd.w, bd.h);
    const s = bd.shade;
    ctx.fillStyle = bd.type === 'tall'
      ? `rgb(${(70 * s) | 0},${(78 * s) | 0},${(92 * s) | 0})`
      : `rgb(${(96 * s) | 0},${(88 * s) | 0},${(80 * s) | 0})`;
    ctx.fillRect(bd.x, bd.y, bd.w, bd.h);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(bd.x + 9, bd.y + 9, bd.w - 18, bd.h - 18);
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.lineWidth = Math.max(0.8, 2 / cam.zoom);
    ctx.strokeRect(bd.x, bd.y, bd.w, bd.h);
  }
  // Деревья
  for (const t of terrain.trees) {
    if (t.x + t.r < b.x1 - 10 || t.x - t.r > b.x2 + 10 ||
        t.y + t.r < b.y1 - 10 || t.y - t.r > b.y2 + 10) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.arc(t.x + 4, t.y + 5, t.r, 0, Math.PI * 2); ctx.fill();
    const s = t.shade;
    ctx.fillStyle = `rgb(${(42 * s) | 0},${(96 * s) | 0},${(38 * s) | 0})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(150,210,110,${0.28 * s})`;
    ctx.beginPath(); ctx.arc(t.x - t.r * 0.3, t.y - t.r * 0.3, t.r * 0.6, 0, Math.PI * 2); ctx.fill();
  }
}

/* ============================================================
   8. ЮНИТЫ
   ============================================================ */
const ATTACK_UNITS = {
  kamikaze: { name: 'Камикадзе', hp: 40, speed: 190, damage: 25, radius: 16 },
  heavy: { name: 'Тяжёлый', hp: 110, speed: 110, damage: 55, radius: 22 },
  jammer: { name: 'РЭБ', hp: 60, speed: 150, damage: 0, radius: 18,
            jamRadius: 240, jamDuration: 4 },
};
const DEFENSE_UNITS = {
  pkt:  { name: 'ПКТ-пикап', hp: 100, range: 240, fireRate: 3.0, damage: 12, mobile: true },
  zu23: { name: 'ЗУ-23-2', hp: 160, range: 320, fireRate: 2.0, damage: 25, mobile: false },
  igla: { name: 'Игла', hp: 80, range: 450, fireRate: 0.7, damage: 80, mobile: false },
};
function unitStat(base, lvl) {
  const mH = 1 + 0.12 * (lvl - 1), mD = 1 + 0.08 * (lvl - 1);
  return { hp: Math.round(base.hp * mH), damage: Math.round(base.damage * mD) };
}

/* ============================================================
   9. СУЩНОСТИ
   ============================================================ */
class Particle {
  constructor(x, y, vx, vy, life, color, size) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life; this.color = color; this.size = size || 3;
  }
  update(dt) {
    this.x += this.vx * dt; this.y += this.vy * dt;
    this.vx *= 0.94; this.vy *= 0.94; this.life -= dt;
  }
  get dead() { return this.life <= 0; }
}
class Tracer {
  constructor(x1, y1, x2, y2, color) {
    this.x1 = x1; this.y1 = y1; this.x2 = x2; this.y2 = y2;
    this.life = 0.16; this.maxLife = 0.16; this.color = color || '#ffd24a';
  }
  update(dt) { this.life -= dt; }
  get dead() { return this.life <= 0; }
}
class DamageText {
  constructor(x, y, val, color) {
    this.x = x; this.y = y; this.val = val; this.color = color || '#fff';
    this.life = 0.9; this.maxLife = 0.9;
  }
  update(dt) { this.y -= 45 * dt; this.life -= dt; }
  get dead() { return this.life <= 0; }
}

class Drone {
  constructor(x, y, typeKey, lvl, player) {
    const base = ATTACK_UNITS[typeKey];
    const st = unitStat(base, lvl);
    this.x = x; this.y = y; this.wx = x; this.wy = y;
    this.typeKey = typeKey;
    this.hp = st.hp; this.maxHp = st.hp;
    this.speed = base.speed; this.radius = base.radius; this.damage = st.damage;
    this.alive = true; this.angle = -Math.PI / 2;
    this.hitFlash = 0; this.bob = Math.random() * Math.PI * 2;
    this.player = !!player;
    this.jamRadius = base.jamRadius || 0;
    this.jamDuration = base.jamDuration || 0;
  }
  update(dt) {
    if (!this.alive) return;
    this.bob += dt * 6;
    const dx = this.wx - this.x, dy = this.wy - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 3) {
      const step = Math.min(dist, this.speed * dt);
      this.x += (dx / dist) * step; this.y += (dy / dist) * step;
      const ta = Math.atan2(dy, dx);
      let da = ta - this.angle;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      this.angle += da * Math.min(1, dt * 6);
    }
    if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt);
  }
}

class Turret {
  constructor(x, y, typeKey, lvl) {
    const base = DEFENSE_UNITS[typeKey];
    const st = unitStat(base, lvl);
    this.x = x; this.y = y;
    this.typeKey = typeKey;
    this.range = base.range;
    this.fireRate = base.fireRate;
    this.damage = st.damage;
    this.hp = st.hp; this.maxHp = st.hp;
    this.cooldown = 0; this.alive = true;
    this.angle = -Math.PI / 2;
    this.maxCooldown = 1 / base.fireRate;
    this.mobile = base.mobile;
    this.jamTime = 0;
  }
  canFire() { return this.cooldown <= 0 && this.jamTime <= 0; }
  markFired() { this.cooldown = this.maxCooldown; }
  update(dt) {
    if (this.cooldown > 0) this.cooldown = Math.max(0, this.cooldown - dt);
    if (this.jamTime > 0) this.jamTime = Math.max(0, this.jamTime - dt);
  }
  inRange(x, y) { return Math.hypot(x - this.x, y - this.y) <= this.range; }
  aimAt(x, y) { this.angle = Math.atan2(y - this.y, x - this.x); }
}

/* МОГ — мобильная огневая группа (пикап с турелью), едет туда-сюда по дороге */
class MOG {
  constructor(road, startT, speed, team) {
    this.road = road;
    this.t = startT;
    this.dir = rnd() < 0.5 ? 1 : -1;
    this.speed = speed;      // в единицах мира/сек
    this.team = team;        // 'attack' (враги) или 'defense' (союзники)
    this.x = 0; this.y = 0;
    this.angle = 0;
    this.turretAngle = -Math.PI / 2;
    this.hp = 120; this.maxHp = 120;
    this.alive = true;
    this.range = 300;
    this.fireRate = 5;
    this.damage = 10;
    this.cooldown = 0;
    this.hitFlash = 0;
    this.updateXY();
  }
  // Длина полилинии
  pathLength() {
    let L = 0;
    for (let i = 0; i < this.road.pts.length - 1; i++) {
      const a = this.road.pts[i], b = this.road.pts[i + 1];
      L += Math.hypot(b.x - a.x, b.y - a.y);
    }
    return L;
  }
  updateXY() {
    const pts = this.road.pts;
    let total = 0; const segLens = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const L = Math.hypot(b.x - a.x, b.y - a.y);
      segLens.push(L); total += L;
    }
    let target = clamp(this.t, 0, 1) * total;
    for (let i = 0; i < segLens.length; i++) {
      if (target <= segLens[i]) {
        const a = pts[i], b = pts[i + 1];
        const k = segLens[i] > 0 ? target / segLens[i] : 0;
        this.x = a.x + (b.x - a.x) * k;
        this.y = a.y + (b.y - a.y) * k;
        this.angle = Math.atan2(b.y - a.y, b.x - a.x) + (this.dir < 0 ? Math.PI : 0);
        return;
      }
      target -= segLens[i];
    }
  }
  update(dt) {
    if (!this.alive) return;
    if (this.cooldown > 0) this.cooldown = Math.max(0, this.cooldown - dt);
    if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt);
    const L = this.pathLength();
    const du = (this.speed * dt * this.dir) / L;
    this.t += du;
    if (this.t > 1) { this.t = 1; this.dir = -1; }
    if (this.t < 0) { this.t = 0; this.dir = 1; }
    this.updateXY();
  }
  canFire() { return this.alive && this.cooldown <= 0; }
  markFired() { this.cooldown = 1 / this.fireRate; }
  inRange(x, y) { return Math.hypot(x - this.x, y - this.y) <= this.range; }
  aimAt(x, y) { this.turretAngle = Math.atan2(y - this.y, x - this.x); }
}

/* ============================================================
   13. ОПЕРАТОР (вид от первого лица с турели в МОГе)
   ============================================================ */
const op = {
  active: false,
  yaw: -Math.PI / 2,       // куда смотрит турель
  pitch: 0.12,             // наклон вверх
  fovH: Math.PI * 0.85,    // горизонтальный обзор ~153°
  fovV: Math.PI * 0.55,    // вертикальный ~99°
  drones: [],
  bullets: [],
  hp: 100, maxHp: 100,
  wave: 0,
  waveTimer: 2.0,
  score: 0,
  fireCD: 0,
  dronesRemaining: 0,
  bob: 0,
};

function opStart() {
  op.active = true;
  op.yaw = -Math.PI / 2;
  op.pitch = 0.12;
  op.drones = [];
  op.bullets = [];
  op.hp = op.maxHp;
  op.wave = 0;
  op.waveTimer = 1.5;
  op.score = 0;
  op.fireCD = 0;
  op.bob = 0;
  op.dronesRemaining = 0;
}

function opSpawnWave() {
  op.wave++;
  const n = 2 + Math.floor(op.wave * 0.7);
  op.dronesRemaining = n;
  for (let i = 0; i < n; i++) {
    const a = rnd() < 0.5 ? rr(-1.1, -0.3) : rr(0.3, 1.1);
    const dist = rr(280, 500);
    op.drones.push({
      x: Math.cos(a) * dist, y: Math.sin(a) * dist,
      z: rr(25, 60),
      hp: 20 + op.wave * 2, maxHp: 20 + op.wave * 2,
      speed: rr(18, 30) + op.wave * 0.6,
      alive: true, hitFlash: 0, wobble: rnd() * Math.PI * 2,
    });
  }
}

function opProject(d) {
  const dist = Math.hypot(d.x, d.y);
  const wa = Math.atan2(d.y, d.x);
  let rel = wa - op.yaw;
  while (rel > Math.PI) rel -= Math.PI * 2;
  while (rel < -Math.PI) rel += Math.PI * 2;
  const vis = Math.abs(rel) < op.fovH / 2;
  const sx = Math.tan(rel) / Math.tan(op.fovH / 2) * (W / 2);
  const screenX = W / 2 + sx;
  const elev = Math.atan2(d.z, dist);
  const relElev = elev - op.pitch;
  const sy = Math.tan(relElev) / Math.tan(op.fovV / 2) * (H / 2);
  const screenY = H / 2 - sy;
  return { sx: screenX, sy: screenY, dist, vis };
}

function opUpdate(dt) {
  if (!op.active) return;
  // Бобинг камеры (имитация езды МОГа)
  op.bob += dt * 3;
  // Управление беспилотниками
  for (const d of op.drones) {
    if (!d.alive) continue;
    d.wobble += dt * 3;
    const dist = Math.hypot(d.x, d.y);
    const nx = -d.x / dist, ny = -d.y / dist;
    d.x += nx * d.speed * dt;
    d.y += ny * d.speed * dt;
    d.z += Math.sin(d.wobble) * 0.5 * dt;
    if (d.hitFlash > 0) d.hitFlash = Math.max(0, d.hitFlash - dt);
    // Долетел до МОГа — урон
    if (dist < 25) {
      d.alive = false;
      op.hp -= 12;
      op.dronesRemaining = Math.max(0, op.dronesRemaining - 1);
      sfxExplode();
    }
  }
  // Пули
  for (let i = op.bullets.length - 1; i >= 0; i--) {
    op.bullets[i].life -= dt;
    if (op.bullets[i].life <= 0) op.bullets.splice(i, 1);
  }
  // Очередь волн
  if (op.dronesRemaining === 0 && op.drones.every(d => !d.alive)) {
    op.waveTimer -= dt;
    if (op.waveTimer <= 0) {
      opSpawnWave();
      op.waveTimer = 3.0;
    }
  }
  if (op.fireCD > 0) op.fireCD = Math.max(0, op.fireCD - dt);
  // Конец
  if (op.hp <= 0) {
    op.active = false;
    if (op.score > (Save.opBest || 0)) { Save.opBest = op.score; commitSave(); }
    G.screen = 'opEnd';
    sfxLose();
  }
}

function opFire() {
  if (!op.active || op.fireCD > 0) return;
  op.fireCD = 0.09;
  sfxMG();
  vibrate(8);
  // Ищем дрон ближе всего к перекрестью
  let best = null, bestAng = Infinity;
  for (const d of op.drones) {
    if (!d.alive) continue;
    const p = opProject(d);
    if (!p.vis) continue;
    // угловое расстояние от центра экрана
    const dx = p.sx - W / 2, dy = p.sy - H / 2;
    const ang = Math.hypot(dx, dy) / Math.max(W, H);
    if (ang < 0.14 && ang < bestAng) { bestAng = ang; best = d; }
  }
  // Визуал пули
  op.bullets.push({ life: 0.08, maxLife: 0.08 });
  if (best) {
    best.hp -= 12;
    best.hitFlash = 0.08;
    if (best.hp <= 0) {
      best.alive = false;
      op.score += 100;
      op.dronesRemaining = Math.max(0, op.dronesRemaining - 1);
      sfxExplode();
    } else sfxHit();
  }
}

function opDraw() {
  const t = now() / 1000;
  const bobY = Math.sin(op.bob) * 3;

  // Небо
  const horizonY = H * 0.5 + bobY + op.pitch * H * 0.5;
  const sky = ctx.createLinearGradient(0, 0, 0, horizonY);
  sky.addColorStop(0, '#1b2d3e');
  sky.addColorStop(1, '#4a5c6e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, horizonY);

  // Земля
  const ground = ctx.createLinearGradient(0, horizonY, 0, H);
  ground.addColorStop(0, '#3c4a24');
  ground.addColorStop(1, '#1a2410');
  ctx.fillStyle = ground;
  ctx.fillRect(0, horizonY, W, H - horizonY);

  // Далёкие силуэты зданий на горизонте
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = '#2a3542';
  for (let i = 0; i < 20; i++) {
    const bx = ((i * 173) % W) - 40;
    const bh = 18 + ((i * 47) % 55);
    ctx.fillRect(bx, horizonY - bh, 60 + ((i * 31) % 50), bh);
  }
  ctx.restore();

  // Дорога внизу — перспектива
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath();
  ctx.moveTo(W / 2 - 30, horizonY);
  ctx.lineTo(W / 2 + 30, horizonY);
  ctx.lineTo(W * 0.95, H);
  ctx.lineTo(W * 0.05, H);
  ctx.closePath(); ctx.fill();

  // Разметка дороги
  ctx.strokeStyle = 'rgba(240,220,120,0.5)';
  ctx.lineWidth = 2;
  const segs = 10;
  for (let i = 0; i < segs; i++) {
    const p = (i + (t * 0.6) % 1) / segs;
    const y1 = horizonY + (H - horizonY) * p * p;
    const y2 = horizonY + (H - horizonY) * Math.min(1, (p + 0.04)) * Math.min(1, (p + 0.04));
    const w1 = 3 + 30 * p * p;
    const w2 = 3 + 30 * Math.min(1, p + 0.04) * Math.min(1, p + 0.04);
    ctx.beginPath();
    ctx.moveTo(W / 2 - w1 / 2, y1);
    ctx.lineTo(W / 2 + w1 / 2, y1);
    ctx.lineTo(W / 2 + w2 / 2, y2);
    ctx.lineTo(W / 2 - w2 / 2, y2);
    ctx.closePath(); ctx.fillStyle = 'rgba(240,220,120,0.45)'; ctx.fill();
  }

  // Дроны (сортируем по дальности — далёкие сначала)
  const proj = op.drones.filter(d => d.alive).map(d => ({ d, p: opProject(d) }));
  proj.sort((a, b) => b.p.dist - a.p.dist);

  for (const { d, p } of proj) {
    if (!p.vis) continue;
    // Размер с учётом расстояния
    const size = clamp(900 / (p.dist + 60), 6, 90);
    const wobY = Math.sin(d.wobble) * size * 0.15;
    ctx.save();
    ctx.translate(p.sx, p.sy + wobY);

    // Тень на земле (для читаемости)
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(0, (H - p.sy) * 0.15, size * 0.8, size * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Миньон/дрон — дельтакрыло
    ctx.rotate(-0.15);
    ctx.fillStyle = d.hitFlash > 0 ? '#ffffff' : '#b89a8a';
    ctx.strokeStyle = '#2a3a4a';
    ctx.lineWidth = Math.max(1, size * 0.05);
    ctx.beginPath();
    ctx.moveTo(0, -size * 0.5);
    ctx.lineTo(size * 0.9, size * 0.3);
    ctx.lineTo(0, size * 0.1);
    ctx.lineTo(-size * 0.9, size * 0.3);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    // Нос
    ctx.fillStyle = d.hitFlash > 0 ? '#ffcc33' : '#c84a3a';
    ctx.beginPath();
    ctx.arc(0, -size * 0.4, size * 0.12, 0, Math.PI * 2);
    ctx.fill();

    // HP-бар
    if (d.hp < d.maxHp) {
      const bw = size * 1.2, bh = Math.max(2, size * 0.08);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-bw / 2, -size * 0.75, bw, bh);
      ctx.fillStyle = '#ff5555';
      ctx.fillRect(-bw / 2, -size * 0.75, bw * (d.hp / d.maxHp), bh);
    }
    ctx.restore();
  }

  // Пули-вспышки у дула (внизу экрана)
  if (op.bullets.length > 0) {
    const b = op.bullets[0];
    const a = b.life / b.maxLife;
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.arc(W / 2, H - 60, 30 * a + 15, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Прицел (крест)
  const cx = W / 2, cy = H / 2;
  ctx.strokeStyle = '#ff4a4a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - 22, cy); ctx.lineTo(cx - 8, cy);
  ctx.moveTo(cx + 8, cy);  ctx.lineTo(cx + 22, cy);
  ctx.moveTo(cx, cy - 22); ctx.lineTo(cx, cy - 8);
  ctx.moveTo(cx, cy + 8);  ctx.lineTo(cx, cy + 22);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ff4a4a'; ctx.fill();

  // Корпус пулемёта (внизу экрана)
  ctx.fillStyle = '#3a4048';
  ctx.fillRect(W / 2 - 40, H - 40, 80, 40);
  ctx.fillStyle = '#5a6068';
  ctx.fillRect(W / 2 - 12, H - 70, 24, 40);

  // Прицел-панорама: стрелка в сторону дрона
  let nearest = null, nearestAng = Infinity;
  for (const d of op.drones) {
    if (!d.alive) continue;
    const p = opProject(d);
    const ang = Math.abs(p.sx - W / 2);
    if (ang < nearestAng) { nearestAng = ang; nearest = p; }
  }
  if (nearest && !nearest.vis) {
    const dir = nearest.sx < W / 2 ? -1 : 1;
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    ctx.beginPath();
    ctx.moveTo(W / 2 + dir * (W * 0.42), H / 2);
    ctx.lineTo(W / 2 + dir * (W * 0.42 - 20), H / 2 - 14);
    ctx.lineTo(W / 2 + dir * (W * 0.42 - 20), H / 2 + 14);
    ctx.closePath(); ctx.fill();
  }

  // HUD
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, 48);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px -apple-system,sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('ОПЕРАТОР · волна ' + op.wave, 16, 24);
  ctx.textAlign = 'right';
  ctx.fillText('Очки: ' + op.score, W - 16, 24);

  // HP МОГа
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, 16, H - 40, W * 0.4, 12, 6); ctx.fill();
  const p = clamp(op.hp / op.maxHp, 0, 1);
  ctx.fillStyle = p > 0.5 ? '#44dd66' : (p > 0.25 ? '#ffaa33' : '#ff4444');
  roundRect(ctx, 18, H - 38, (W * 0.4 - 4) * p, 8, 4); ctx.fill();

  // Кнопка огня
  const fb = { x: W - 110, y: H - 130, r: 60 };
  ctx.fillStyle = 'rgba(200,60,40,0.85)';
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffaa33'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('ОГОНЬ', fb.x, fb.y);
  ctx.font = '11px -apple-system,sans-serif';
  ctx.fillText('удерживай', fb.x, fb.y + 20);
  G._opFireBtn = fb;

  // Кнопка меню
  const mb = { x: 14, y: 58, w: 80, h: 32 };
  ctx.fillStyle = 'rgba(20,30,45,0.85)';
  roundRect(ctx, mb.x, mb.y, mb.w, mb.h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,210,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e8f4ff';
  ctx.font = 'bold 13px -apple-system,sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('‹ ВЫЙТИ', mb.x + mb.w / 2, mb.y + mb.h / 2);
  G._opMenuBtn = mb;

  // Подсказка на первые секунды
  if (op.wave === 0 && op.waveTimer > 1.0) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold 17px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Свайп влево/вправо — поворот', W / 2, H * 0.72);
    ctx.fillText('Кнопка ОГОНЬ — стрельба', W / 2, H * 0.72 + 26);
  }
}

/* ============================================================
   14. БОЕВАЯ ЛОГИКА (вид сверху)
   ============================================================ */
function damageDrone(d, dmg) {
  if (!d.alive) return;
  d.hp -= dmg; d.hitFlash = 0.12;
  G.dmgTexts.push(new DamageText(d.x + rr(-8, 8), d.y - 26, dmg, '#ffcc33'));
  sfxHit();
  if (d.hp <= 0) {
    d.alive = false;
    explode(d.x, d.y, false); sfxExplode(); shakeCamera(3, 0.15);
  }
}
function explode(x, y, big) {
  const n = big ? 60 : 30;
  for (let i = 0; i < n; i++) {
    G.particles.push(new Particle(x, y, rr(-450, 450), rr(-450, 450),
      rr(0.7, 1.7),
      i % 3 === 0 ? '#ffffff' : (i % 3 === 1 ? '#ffcc33' : '#ff5522'),
      big ? 6 : 5));
  }
}
function fireTurretAt(t, tx, ty) {
  t.markFired(); t.aimAt(tx, ty);
  G.tracers.push(new Tracer(t.x, t.y, tx, ty)); sfxShot();
  for (let i = 0; i < 3; i++)
    G.particles.push(new Particle(t.x + Math.cos(t.angle) * 24, t.y + Math.sin(t.angle) * 24,
      rr(-80, 80), rr(-80, 80), 0.25, '#ffd24a', 3));
}
function fireMOGAt(m, tx, ty) {
  m.markFired(); m.aimAt(tx, ty);
  G.tracers.push(new Tracer(m.x, m.y, tx, ty, '#aaffaa'));
  sfxShot();
  for (let i = 0; i < 3; i++)
    G.particles.push(new Particle(m.x + Math.cos(m.turretAngle) * 20, m.y + Math.sin(m.turretAngle) * 20,
      rr(-80, 80), rr(-80, 80), 0.22, '#ffd24a', 2));
}

function tryLaunchDrone(wx, wy) {
  if (G.deployed >= G.selectedUnits.length) return;
  const tk = G.selectedUnits[G.deployed];
  const lvl = Save.upgrades[tk] || 1;
  const sx = clamp(wx + rr(-40, 40), 60, WORLD_W - 60);
  const sy = WORLD_H - 100;
  const d = new Drone(sx, sy, tk, lvl, true);
  d.wx = wx; d.wy = wy;
  G.drones.push(d);
  G.deployed++;
  sfxClick();
}

function updateAttack(dt) {
  for (const d of G.drones) {
    if (!d.alive) continue;
    d.update(dt);
    if (d.typeKey === 'jammer' && d.jamRadius > 0) {
      for (const t of G.turrets)
        if (Math.hypot(t.x - d.x, t.y - d.y) < d.jamRadius) t.jamTime = d.jamDuration;
    }
    for (const t of G.turrets) {
      if (!t.alive || !t.canFire()) continue;
      if (!t.inRange(d.x, d.y)) continue;
      fireTurretAt(t, d.x, d.y);
      damageDrone(d, t.damage);
      if (!d.alive) break;
    }
    if (!d.alive) continue;
    // Вражеские МОГи стреляют по нашим дронам
    for (const m of G.mogs) {
      if (m.team !== 'attack' || !m.canFire()) continue;
      if (!m.inRange(d.x, d.y)) continue;
      fireMOGAt(m, d.x, d.y);
      damageDrone(d, m.damage);
      if (!d.alive) break;
    }
    if (!d.alive) continue;
    if (G.target) {
      const dist = Math.hypot(G.target.x - d.x, G.target.y - d.y);
      if (dist < G.target.radius + d.radius) {
        if (d.damage > 0) {
          G.target.hp -= d.damage;
          G.dmgTexts.push(new DamageText(G.target.x + rr(-30, 30), G.target.y - 60, d.damage, '#ff8844'));
          G.screenFlash = 0.3; shakeCamera(5, 0.2); explode(d.x, d.y, true); sfxExplode();
        }
        d.alive = false;
      }
    }
  }
  if (G.target.hp <= 0) finishMission();
  else if (G.drones.every(d => !d.alive) && G.deployed >= G.selectedUnits.length) finishMission();
}

function spawnEnemyDrone() {
  const x = rr(400, WORLD_W - 400);
  const types = ['kamikaze', 'kamikaze', 'kamikaze', 'heavy'];
  const tk = types[Math.floor(rnd() * types.length)];
  const lvl = clamp(1 + Math.floor((G.time / 45) | 0), 1, 5);
  const d = new Drone(x, WORLD_H - 120, tk, lvl, false);
  d.wx = G.target.x + rr(-120, 120);
  d.wy = G.target.y + rr(-20, 20);
  d.speed = rr(110, 155);
  d.hp = Math.round(d.maxHp * 0.7); d.maxHp = d.hp;
  G.drones.push(d);
}

function updateDefense(dt) {
  if (G.placement.active) return;
  if (G.spawnQueue > 0) {
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) {
      spawnEnemyDrone();
      if (G.mission.id !== 'endless') G.spawnQueue--;
      G.spawnTimer = G.spawnInterval;
      if (G.mission.id !== 'endless' && G.spawnQueue === 0) setMessage('Последняя цель!', 2);
    }
  }
  for (const d of G.drones) {
    if (!d.alive) continue;
    d.update(dt);
    // Союзные МОГи стреляют по врагам
    for (const m of G.mogs) {
      if (m.team !== 'defense' || !m.canFire()) continue;
      if (!m.inRange(d.x, d.y)) continue;
      fireMOGAt(m, d.x, d.y);
      damageDrone(d, m.damage);
      if (!d.alive) break;
    }
    if (!d.alive) continue;
    if (G.target) {
      const dist = Math.hypot(G.target.x - d.x, G.target.y - d.y);
      if (dist < G.target.radius + d.radius) {
        G.target.hp -= d.damage;
        d.alive = false;
        G.screenFlash = 0.3; shakeCamera(6, 0.25);
        explode(d.x, d.y, true); sfxExplode();
      }
    }
  }
  if (G.target.hp <= 0) { G.result = 'lose'; finishMission(); }
  else if (G.mission.id !== 'endless' && G.spawnQueue === 0 && G.drones.every(d => !d.alive))
    finishMission();
}

function computeStars() {
  if (G.side === 'attack') {
    if (G.target.hp <= 0) return 1;
    const rem = G.target.hp;
    const [s1, s2, s3] = G.mission.starsHp;
    if (rem >= s3) return 3;
    if (rem >= s2) return 2;
    return 1;
  }
  const hp = G.target.hp;
  if (hp >= 100) return 3;
  if (hp >= 60) return 2;
  return 1;
}

function finishMission() {
  const win = (G.side === 'attack')
    ? (G.target.hp <= 0)
    : (G.target.hp > 0 && G.mission.id !== 'endless');
  G.result = win ? 'win' : 'lose';
  G.screen = 'victory';
  if (G.mission.id === 'endless') {
    if (G.time > (Save.endlessBest || 0)) { Save.endlessBest = G.time; commitSave(); }
    sfxLose();
    return;
  }
  if (win) {
    const stars = computeStars();
    const prev = Save.stars[G.mission.id] || 0;
    if (stars > prev) Save.stars[G.mission.id] = stars;
    const reward = G.mission.reward + stars * 40;
    Save.credits = (Save.credits || 0) + reward;
    G.lastReward = { credits: reward, stars };
    if (G.mission.id === 'a1') Save.unlocked.attack.heavy = true;
    if (G.mission.id === 'a2') Save.unlocked.attack.jammer = true;
    if (G.mission.id === 'a3') Save.unlocked.defense.zu23 = true;
    if (G.mission.id === 'a4') Save.unlocked.defense.igla = true;
    commitSave();
    sfxWin();
  } else sfxLose();
}

/* ============================================================
   15. ОБНОВЛЕНИЕ
   ============================================================ */
function updateCamera(dt) {
  if (cam.follow && G.side === 'attack') {
    const alive = G.drones.filter(d => d.alive);
    if (alive.length > 0) {
      let cx = 0, cy = 0;
      for (const d of alive) { cx += d.x; cy += d.y; }
      cx /= alive.length; cy /= alive.length;
      cam.x += (cx - cam.x) * Math.min(1, dt * 2.5);
      cam.y += (cy - cam.y) * Math.min(1, dt * 2.5);
    }
  }
  cam.zoom += (cam.targetZoom - cam.zoom) * Math.min(1, dt * 10);
  if (cam.shakeTime > 0) {
    cam.shakeTime -= dt;
    cam.shakeX = rr(-1, 1) * cam.shakeMag;
    cam.shakeY = rr(-1, 1) * cam.shakeMag;
    cam.shakeMag *= 0.9;
    if (cam.shakeTime <= 0) { cam.shakeMag = 0; cam.shakeX = 0; cam.shakeY = 0; }
  }
  clampCamera();
}

function update(dt) {
  if (op.active) { opUpdate(dt); return; }

  for (let i = G.tracers.length - 1; i >= 0; i--) {
    G.tracers[i].update(dt); if (G.tracers[i].dead) G.tracers.splice(i, 1);
  }
  for (let i = G.particles.length - 1; i >= 0; i--) {
    G.particles[i].update(dt); if (G.particles[i].dead) G.particles.splice(i, 1);
  }
  for (let i = G.dmgTexts.length - 1; i >= 0; i--) {
    G.dmgTexts[i].update(dt); if (G.dmgTexts[i].dead) G.dmgTexts.splice(i, 1);
  }
  for (const t of G.turrets) t.update(dt);
  for (const m of G.mogs) m.update(dt);
  if (G.screenFlash > 0) G.screenFlash = Math.max(0, G.screenFlash - dt);

  if (G.screen !== 'battle') return;
  G.time += dt;
  if (G.messageTime > 0) G.messageTime = Math.max(0, G.messageTime - dt);

  updateCamera(dt);
  if (G.side === 'attack') updateAttack(dt);
  else updateDefense(dt);
}

/* ============================================================
   16. ДЕЙСТВИЯ (вид сверху)
   ============================================================ */
function tryPlaceTurret(x, y) {
  if (x < PLACE_ZONE.x1 || x > PLACE_ZONE.x2 || y < PLACE_ZONE.y1 || y > PLACE_ZONE.y2) {
    setMessage('Вне зоны размещения', 1.5); return;
  }
  for (const t of G.turrets)
    if (Math.hypot(t.x - x, t.y - y) < 180) { setMessage('Слишком близко', 1.5); return; }
  const tk = G.placement.queue[G.placement.placed] || 'pkt';
  const lvl = Save.upgrades[tk] || 1;
  G.turrets.push(new Turret(x, y, tk, lvl));
  G.placement.placed++;
  sfxClick();
  if (G.placement.placed >= G.placement.required) {
    G.placement.active = false;
    setMessage('Оборона готова!', 3);
    G.spawnTimer = 2.0;
  } else {
    const nk = G.placement.queue[G.placement.placed];
    setMessage(`Поставить: ${DEFENSE_UNITS[nk].name} (${G.placement.placed + 1}/${G.placement.required})`, 4);
  }
}
function fireAllTurrets() {
  for (const t of G.turrets) {
    if (!t.alive || !t.canFire()) continue;
    let best = null, bd = Infinity;
    for (const d of G.drones) {
      if (!d.alive) continue;
      const dd = Math.hypot(t.x - d.x, t.y - d.y);
      if (dd <= t.range && dd < bd) { bd = dd; best = d; }
    }
    if (!best) continue;
    fireTurretAt(t, best.x, best.y);
    damageDrone(best, t.damage);
  }
}
function setAttackWaypoint(wx, wy) {
  const offs = [[-90, 0], [0, -60], [90, 0], [0, 60], [-50, -40], [50, 40]];
  for (let i = 0; i < G.drones.length; i++) {
    const d = G.drones[i]; if (!d.alive) continue;
    const o = offs[i % offs.length];
    d.wx = clamp(wx + o[0], 30, WORLD_W - 30);
    d.wy = clamp(wy + o[1], 30, WORLD_H - 30);
  }
}

/* ============================================================
   17. UI-КНОПКИ
   ============================================================ */
function hitRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }

function getBattleUI() {
  const btns = {};
  const pad = 22, r = 26;
  btns.zoomIn  = { cx: W - pad - r, cy: H - pad - r, r };
  btns.zoomOut = { cx: W - pad - r, cy: H - pad - r - 64, r };
  if (G.side === 'attack') {
    btns.follow = { cx: W - pad - r, cy: H - pad - r - 128, r };
    btns.launch = { x: 14, y: H - 92, w: 150, h: 60 };
  } else if (!G.placement.active) {
    btns.fire = { x: W - 170, y: H - 92, w: 156, h: 60 };
  }
  btns.menu = { x: 14, y: 62, w: 90, h: 34 };
  return btns;
}

function handleBattleTap(x, y) {
  const b = getBattleUI();
  if (Math.hypot(x - b.zoomIn.cx, y - b.zoomIn.cy) < b.zoomIn.r) { zoomAt(W / 2, H / 2, cam.zoom * 1.35); return; }
  if (Math.hypot(x - b.zoomOut.cx, y - b.zoomOut.cy) < b.zoomOut.r) { zoomAt(W / 2, H / 2, cam.zoom / 1.35); return; }
  if (b.follow && Math.hypot(x - b.follow.cx, y - b.follow.cy) < b.follow.r) { cam.follow = !cam.follow; sfxClick(); return; }
  if (b.launch && hitRect(x, y, b.launch)) {
    setAttackWaypoint(cam.x, cam.y - 300);
    tryLaunchDrone(cam.x, cam.y - 300);
    return;
  }
  if (b.fire && hitRect(x, y, b.fire)) { fireAllTurrets(); return; }
  if (hitRect(x, y, b.menu)) { G.screen = 'menu'; sfxClick(); return; }
  const wp = screenToWorld(x, y);
  if (G.side === 'attack') {
    if (G.deployed < G.selectedUnits.length) tryLaunchDrone(wp.x, wp.y);
    else setAttackWaypoint(wp.x, wp.y);
  } else if (G.placement.active) tryPlaceTurret(wp.x, wp.y);
}

/* ============================================================
   18. ВВОД (универсальный)
   ============================================================ */
const pointers = new Map();
let pinchState = null;

function onDown(e) {
  e.preventDefault();
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, {
    id: e.pointerId, startX: e.clientX, startY: e.clientY,
    x: e.clientX, y: e.clientY, startTime: now(),
    moved: false, wasPan: false, suppressTap: false,
  });
  if (pointers.size === 2) {
    const pts = Array.from(pointers.values());
    pinchState = {
      dist0: Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y),
      zoom0: cam.zoom,
      cx: (pts[0].x + pts[1].x) / 2, cy: (pts[0].y + pts[1].y) / 2,
    };
  } else if (pointers.size === 1 && G.screen === 'battle' && !op.active) {
    if (G.side === 'defense' && !G.placement.active) {
      const w = screenToWorld(e.clientX, e.clientY);
      const grabR = 60 / cam.zoom;
      for (const t of G.turrets) {
        if (Math.hypot(t.x - w.x, t.y - w.y) < grabR) {
          G.draggingTurret = t;
          G.dragOffset.x = t.x - w.x; G.dragOffset.y = t.y - w.y;
          break;
        }
      }
    }
  }
}

function onMove(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  e.preventDefault();
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.hypot(e.clientX - p.startX, e.clientY - p.startY) > 10) p.moved = true;

  // ОПЕРАТОР: свайп = поворот турели
  if (op.active) {
    if (pointers.size === 1) {
      op.yaw += dx * 0.005;
      op.pitch = clamp(op.pitch + dy * -0.003, -0.15, 0.55);
      // Удержание = огонь
      if (op.fireCD <= 0) opFire();
    }
    return;
  }

  if (pointers.size >= 2 && pinchState) {
    const pts = Array.from(pointers.values());
    const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    if (pinchState.dist0 > 5) zoomAt(pinchState.cx, pinchState.cy, pinchState.zoom0 * (dist / pinchState.dist0));
    return;
  }
  if (G.draggingTurret) {
    const w = screenToWorld(e.clientX, e.clientY);
    G.draggingTurret.x = clamp(w.x + G.dragOffset.x, PLACE_ZONE.x1, PLACE_ZONE.x2);
    G.draggingTurret.y = clamp(w.y + G.dragOffset.y, PLACE_ZONE.y1, PLACE_ZONE.y2);
    return;
  }
  if (p.moved && pointers.size === 1) {
    cam.x -= dx / cam.zoom; cam.y -= dy / cam.zoom; clampCamera();
    if (G.side === 'attack') cam.follow = false;
    p.wasPan = true;
  }
}

function onUp(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  pointers.delete(e.pointerId);
  const wasDrag = !!G.draggingTurret;
  if (wasDrag) G.draggingTurret = null;
  if (pointers.size >= 2) return;
  pinchState = null;
  if (pointers.size === 0) {
    if (!p.moved && !p.wasPan && !wasDrag && now() - p.startTime < 500) onTap(e.clientX, e.clientY);
  } else {
    const rem = Array.from(pointers.values())[0];
    rem.suppressTap = true;
  }
}

/* ============================================================
   19. ДИСПЕТЧЕР ТАПОВ
   ============================================================ */
function onTap(x, y) {
  audioCtx();
  if (op.active) {
    // Кнопка огня
    if (G._opFireBtn && Math.hypot(x - G._opFireBtn.x, y - G._opFireBtn.y) < G._opFireBtn.r) {
      opFire(); return;
    }
    // Кнопка выхода
    if (G._opMenuBtn && hitRect(x, y, G._opMenuBtn)) {
      op.active = false;
      if (op.score > (Save.opBest || 0)) { Save.opBest = op.score; commitSave(); }
      G.screen = 'menu'; sfxClick(); return;
    }
    // Тап по экрану — тоже выстрел
    opFire();
    return;
  }
  if (G.screen === 'menu')     return tapMenu(x, y);
  if (G.screen === 'campaign') return tapCampaign(x, y);
  if (G.screen === 'briefing') return tapBriefing(x, y);
  if (G.screen === 'upgrades') return tapUpgrades(x, y);
  if (G.screen === 'battle')   return handleBattleTap(x, y);
  if (G.screen === 'victory')  return tapVictory(x, y);
  if (G.screen === 'opEnd')    return tapOpEnd(x, y);
}

/* ============================================================
   20. ЭКРАНЫ
   ============================================================ */
function drawMenu() {
  ctx.fillStyle = '#0a0e14'; ctx.fillRect(0, 0, W, H);
  const t = now() / 1000;
  ctx.save(); ctx.globalAlpha = 0.12;
  for (let i = 0; i < 7; i++) {
    const x = ((i * 0.17 + t * 0.04) % 1.3 - 0.15) * W;
    const y = H * 0.09 + i * 42 + Math.sin(t + i) * 14;
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.05);
    ctx.fillStyle = '#5ac8ff';
    ctx.beginPath();
    ctx.moveTo(18, 0); ctx.lineTo(-8, -11); ctx.lineTo(-3, 0); ctx.lineTo(-8, 11);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#5ac8ff';
  ctx.font = `bold ${Math.min(42, W / 8)}px -apple-system,sans-serif`;
  ctx.fillText('ТИХИЙ УДАР', W / 2, H * 0.16);
  ctx.fillStyle = '#ff8844';
  ctx.font = 'bold 16px -apple-system,sans-serif';
  ctx.fillText('— версия 4.0 —', W / 2, H * 0.16 + 36);
  ctx.fillStyle = '#ffcc33';
  ctx.font = 'bold 18px -apple-system,sans-serif';
  ctx.fillText('₽ ' + (Save.credits || 0), W / 2, H * 0.16 + 68);

  const bw = Math.min(340, W * 0.84), bh = 58;
  const bx = (W - bw) / 2;

function wrapText(text, maxW, c) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (c.measureText(test).width > maxW) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawTarget() {
  const t = G.target; if (!t) return;
  const g = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, t.radius * 1.7);
  g.addColorStop(0, 'rgba(255,70,70,0.20)');
  g.addColorStop(1, 'rgba(255,70,70,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#26161a'; ctx.strokeStyle = '#c04040';
  ctx.lineWidth = Math.max(2, 3 / cam.zoom);
  ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * 0.55, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,80,80,0.85)';
  const k = t.radius * 0.85;
  ctx.beginPath();
  ctx.moveTo(t.x - k, t.y); ctx.lineTo(t.x + k, t.y);
  ctx.moveTo(t.x, t.y - k); ctx.lineTo(t.x, t.y + k);
  ctx.stroke();
  const bw = t.radius * 2.2, bh = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(t.x - bw / 2, t.y - t.radius - 34, bw, bh);
  const p = clamp(t.hp / t.maxHp, 0, 1);
  ctx.fillStyle = p > 0.5 ? '#ff4444' : (p > 0.25 ? '#ff8844' : '#ffcc33');
  ctx.fillRect(t.x - bw / 2 + 1, t.y - t.radius - 33, (bw - 2) * p, bh - 2);
}

function drawTurret(t) {
  ctx.beginPath();

  ctx.lineWidth = Math.max(1, 1.5 / cam.zoom);
  ctx.setLineDash([12, 12]); ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.translate(t.x, t.y);

  ctx.fillRect(-16, -11, 40, 30);
  ctx.fillStyle = '#3a4048';
  ctx.fillRect(-20, -15, 40, 30);
  ctx.strokeStyle = '#5a6068';
  ctx.lineWidth = Math.max(1, 1.5 / cam.zoom);
  ctx.strokeRect(-20, -15, 40, 30);

  ctx.fillRect(-18, -19, 9, 5); ctx.fillRect(9, -19, 9, 5);
  ctx.fillRect(-18, 14, 9, 5); ctx.fillRect(9, 14, 9, 5);
  ctx.fillStyle = '#2a3038'; ctx.fillRect(-16, -10, 12, 20);
  ctx.fillStyle = '#2a3038';
  ctx.beginPath(); ctx.arc(2, 0, 12, 0, Math.PI * 2); ctx.fill();

}

function drawMOG(m) {
  if (!m.alive) return;

  ctx.arc(m.x, m.y, m.range, 0, Math.PI * 2);
  ctx.strokeStyle = m.team === 'attack' ? 'rgba(255,120,60,0.18)' : 'rgba(100,220,150,0.22)';
  ctx.lineWidth = Math.max(1, 1 / cam.zoom);
  ctx.setLineDash([8, 12]); ctx.stroke(); ctx.setLineDash([]);

  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.angle);
  // Тень

  ctx.fillRect(-24 + 5, -14 + 5, 52, 30);

  ctx.fillStyle = '#5a4a3a';
  ctx.fillRect(-26, -13, 52, 26);
  ctx.strokeStyle = '#2a1f15';

  ctx.fillRect(8, -12, 18, 24);
  ctx.fillStyle = '#7090a8';
  ctx.fillRect(10, -10, 14, 20);
  // Колёса
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(-20, -17, 12, 5);
  ctx.fillRect(-4, -17, 12, 5);
  ctx.fillRect(-20, 12, 12, 5);
  ctx.fillRect(-4, 12, 12, 5);
  ctx.restore();
  // Турель
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.turretAngle);
  ctx.fillStyle = '#2a2f36';
  ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a5058'; ctx.stroke();
  ctx.fillStyle = '#6a7278'; ctx.fillRect(0, -3, 28, 6);
  ctx.fillStyle = '#8a9298'; ctx.fillRect(25, -3, 4, 6);
  ctx.restore();
  // HP-бар
  if (m.hp < m.maxHp) {
    const bw = 44;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(m.x - bw / 2, m.y - 30, bw, 4);
    ctx.fillStyle = m.team === 'attack' ? '#ff6644' : '#44cc88';
    ctx.fillRect(m.x - bw / 2, m.y - 30, bw * (m.hp / m.maxHp), 4);
  }
}

function drawDroneUAV(d) {
  const bob = Math.sin(d.bob) * 1.5;
  ctx.save(); ctx.translate(d.x, d.y + bob); ctx.rotate(d.angle);
  ctx.fillStyle = 'rgba(120,200,255,0.45)';
  ctx.beginPath(); ctx.ellipse(-22, 0, 12, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  let base = d.player ? '#8aa0b8' : '#b89a8a';
  if (d.typeKey === 'heavy') base = d.player ? '#7a6a4a' : '#a08a6a';
  if (d.typeKey === 'jammer') base = '#6ac8a0';
  const body = d.hitFlash > 0 ? '#ffffff' : base;
  ctx.fillStyle = body;
  ctx.strokeStyle = '#2a3a4a';
  ctx.lineWidth = Math.max(1, 1.6 / cam.zoom);
  ctx.beginPath();
  ctx.moveTo(20, 0); ctx.lineTo(-7, -18); ctx.lineTo(-15, -6);
  ctx.lineTo(-15, 6); ctx.lineTo(-7, 18);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = Math.max(1, 1 / cam.zoom);
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, 0); ctx.stroke();
  ctx.fillStyle = d.hitFlash > 0 ? '#ffcc33' : (d.player ? '#3a7ec8' : '#c84a3a');
  ctx.beginPath(); ctx.arc(15, 0, 3.5, 0, Math.PI * 2); ctx.fill();
  if (d.typeKey === 'jammer') {
    ctx.strokeStyle = `rgba(100,255,180,${0.3 + 0.3 * Math.sin(now() / 120)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(230,230,230,0.75)';
  ctx.lineWidth = Math.max(1, 1.5 / cam.zoom);
  const pA = (now() / 25) % (Math.PI * 2);
  const pLen = Math.abs(Math.cos(pA)) * 10;
  ctx.beginPath(); ctx.moveTo(-19, -pLen); ctx.lineTo(-19, pLen); ctx.stroke();
  ctx.restore();
  if (d.hp < d.maxHp) {
    const bw = 34;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(d.x - bw / 2, d.y - 30 + bob, bw, 4);
    ctx.fillStyle = (d.hp / d.maxHp) > 0.5 ? '#44dd66' : ((d.hp / d.maxHp) > 0.25 ? '#ffaa33' : '#ff4444');
    ctx.fillRect(d.x - bw / 2, d.y - 30 + bob, bw * (d.hp / d.maxHp), 4);
  }
}

function drawWorld() {
  ctx.save(); applyCamera();
  drawTerrain();
  drawTarget();
  if (G.side === 'defense' && G.placement.active) {
    ctx.fillStyle = 'rgba(90,200,255,0.06)';
    ctx.fillRect(PLACE_ZONE.x1, PLACE_ZONE.y1,
                 PLACE_ZONE.x2 - PLACE_ZONE.x1, PLACE_ZONE.y2 - PLACE_ZONE.y1);
    ctx.strokeStyle = 'rgba(90,200,255,0.45)';
    ctx.setLineDash([14, 10]);
    ctx.lineWidth = Math.max(1.5, 2 / cam.zoom);
    ctx.strokeRect(PLACE_ZONE.x1, PLACE_ZONE.y1,
                   PLACE_ZONE.x2 - PLACE_ZONE.x1, PLACE_ZONE.y2 - PLACE_ZONE.y1);
    ctx.setLineDash([]);
  }
  for (const m of G.mogs) drawMOG(m);
  for (const t of G.turrets) drawTurret(t);

  ctx.lineWidth = Math.max(1.5, 2 / cam.zoom);
  for (const tr of G.tracers) {
    ctx.globalAlpha = clamp(tr.life / tr.maxLife, 0, 1);
    ctx.strokeStyle = tr.color;
    ctx.beginPath(); ctx.moveTo(tr.x1, tr.y1); ctx.lineTo(tr.x2, tr.y2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const d of G.drones) if (d.alive) drawDroneUAV(d);
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 16px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  for (const dt of G.dmgTexts) {
    ctx.globalAlpha = clamp(dt.life / dt.maxLife, 0, 1);
    ctx.fillStyle = dt.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3;
    ctx.strokeText('-' + dt.val, dt.x, dt.y);
    ctx.fillText('-' + dt.val, dt.x, dt.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawMinimap() {
  const mmW = 90;
  const mmH = mmW * (WORLD_H / WORLD_W);
  const mmX = W - mmW - 14;
  const mmY = 62;
  ctx.save(); ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(10,14,20,0.85)';
  roundRect(ctx, mmX, mmY, mmW, mmH, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(120,150,180,0.5)'; ctx.lineWidth = 1;
  roundRect(ctx, mmX, mmY, mmW, mmH, 6); ctx.stroke();
  const sx = mmW / WORLD_W, sy = mmH / WORLD_H;
  // Река
  ctx.strokeStyle = 'rgba(80,140,200,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < terrain.river.length; i++) {
    const p = terrain.river[i];
    if (i === 0) ctx.moveTo(mmX + p.x * sx, mmY + p.y * sy);
    else ctx.lineTo(mmX + p.x * sx, mmY + p.y * sy);
  }
  ctx.stroke();
  // Дороги
  ctx.strokeStyle = 'rgba(200,180,120,0.4)'; ctx.lineWidth = 0.8;
  for (const r of terrain.roads) {
    ctx.beginPath();
    ctx.moveTo(mmX + r.pts[0].x * sx, mmY + r.pts[0].y * sy);
    for (let i = 1; i < r.pts.length; i++)
      ctx.lineTo(mmX + r.pts[i].x * sx, mmY + r.pts[i].y * sy);
    ctx.stroke();
  }
  if (G.target) {
    ctx.fillStyle = '#ff4444';
    ctx.beginPath(); ctx.arc(mmX + G.target.x * sx, mmY + G.target.y * sy, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#ff8844';
  for (const t of G.turrets) ctx.fillRect(mmX + t.x * sx - 1.5, mmY + t.y * sy - 1.5, 3, 3);
  for (const m of G.mogs) {
    ctx.fillStyle = m.team === 'attack' ? '#ff6644' : '#44cc88';
    ctx.fillRect(mmX + m.x * sx - 2, mmY + m.y * sy - 2, 4, 4);
  }
  for (const d of G.drones) {
    if (!d.alive) continue;
    ctx.fillStyle = d.player ? '#5ac8ff' : '#ffaa33';
    ctx.beginPath(); ctx.arc(mmX + d.x * sx, mmY + d.y * sy, 2, 0, Math.PI * 2); ctx.fill();
  }
  const halfW = W / 2 / cam.zoom, halfH = H / 2 / cam.zoom;
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
  ctx.strokeRect(mmX + clamp(cam.x - halfW, 0, WORLD_W) * sx,
                 mmY + clamp(cam.y - halfH, 0, WORLD_H) * sy,
                 Math.min(halfW * 2, WORLD_W) * sx,
                 Math.min(halfH * 2, WORLD_H) * sy);
  ctx.restore();
}

function drawBattleHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, 52);
  ctx.font = 'bold 15px -apple-system,sans-serif';
  ctx.textBaseline = 'middle';
  const alive = G.drones.filter(d => d.alive).length;
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  const left = G.side === 'attack'
    ? `БПЛА: ${alive}/${G.selectedUnits.length}`
    : `Целей: ${alive + (G.spawnQueue > 100 ? 0 : G.spawnQueue)}`;
  ctx.fillText(left, 116, 26);
  ctx.textAlign = 'right';
  ctx.fillStyle = G.side === 'attack' ? '#5ac8ff' : '#ff8844';
  ctx.fillText(G.side === 'attack' ? 'АТАКА' : 'ОБОРОНА', W - 16, 26);

  if (G.target) {
    const bw = W * 0.55, bx = 16, by = 46;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, bx, by, bw, 8, 4); ctx.fill();
    const p = clamp(G.target.hp / G.target.maxHp, 0, 1);
    ctx.fillStyle = G.side === 'attack' ? '#ff5555' : '#44dd66';
    roundRect(ctx, bx + 1, by + 1, (bw - 2) * p, 6, 3); ctx.fill();
  }

  const btns = getBattleUI();
  ctx.textAlign = 'center';
  for (const k of ['zoomIn', 'zoomOut', 'follow']) {
    const b = btns[k]; if (!b) continue;
    const active = k === 'follow' && cam.follow;
    ctx.fillStyle = active ? 'rgba(90,200,255,0.35)' : 'rgba(20,30,40,0.75)';
    ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = active ? '#5ac8ff' : 'rgba(150,180,210,0.6)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#e8f4ff';
    ctx.font = 'bold 22px -apple-system,sans-serif';
    ctx.textBaseline = 'middle';
    const lbl = k === 'zoomIn' ? '+' : k === 'zoomOut' ? '−' : '◎';
    ctx.fillText(lbl, b.cx, b.cy + 1);
  }
  if (btns.launch) {
    const can = G.deployed < G.selectedUnits.length;
    ctx.fillStyle = can ? '#2a5a3a' : '#2a2f36';
    roundRect(ctx, btns.launch.x, btns.launch.y, btns.launch.w, btns.launch.h, 12); ctx.fill();
    ctx.strokeStyle = can ? '#66cc88' : 'rgba(120,140,160,0.35)';
    ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = can ? '#e8ffe8' : '#6a7078';
    ctx.font = 'bold 15px -apple-system,sans-serif';
    const nk = G.selectedUnits[G.deployed];
    const lbl = can ? ('▶ ' + (nk ? ATTACK_UNITS[nk].name : '')) : 'ВСЕ ВЫПУЩЕНЫ';
    ctx.fillText(lbl, btns.launch.x + btns.launch.w / 2, btns.launch.y + btns.launch.h / 2);
  }
  if (btns.fire) {
    ctx.fillStyle = '#7a3a16';
    roundRect(ctx, btns.fire.x, btns.fire.y, btns.fire.w, btns.fire.h, 12); ctx.fill();
    ctx.strokeStyle = '#ff8844'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffeee0';
    ctx.font = 'bold 15px -apple-system,sans-serif';
    ctx.fillText('🔥 ОГОНЬ', btns.fire.x + btns.fire.w / 2, btns.fire.y + btns.fire.h / 2);
  }
  const m = btns.menu;
  ctx.fillStyle = 'rgba(20,30,45,0.85)';
  roundRect(ctx, m.x, m.y, m.w, m.h, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(150,180,210,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#e8f4ff';
  ctx.font = 'bold 13px -apple-system,sans-serif';
  ctx.fillText('‹ МЕНЮ', m.x + m.w / 2, m.y + m.h / 2);

  if (G.messageTime > 0) {
    ctx.globalAlpha = clamp(G.messageTime, 0, 1);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffeebb';
    ctx.font = 'bold 15px -apple-system,sans-serif';
    ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6;
    ctx.fillText(G.message, W / 2, H - 130);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
  if (G.screenFlash > 0) {
    ctx.globalAlpha = G.screenFlash * 1.5;
    ctx.fillStyle = '#ff8844';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  drawMinimap();
}

/* ============================================================
   22. ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
let lastT = 0;
function loop(t) {
  if (!lastT) lastT = t;
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.1) dt = 0.1;

  update(dt);
  ctx.clearRect(0, 0, W, H);

  if (op.active) {
    opDraw();
  } else if (G.screen === 'menu') drawMenu();
  else if (G.screen === 'campaign') drawCampaign();
  else if (G.screen === 'briefing') drawBriefing();
  else if (G.screen === 'upgrades') drawUpgrades();
  else if (G.screen === 'battle') { drawWorld(); drawBattleHUD(); }
  else if (G.screen === 'victory') { drawWorld(); drawBattleHUD(); drawVictory(); }
  else if (G.screen === 'opEnd') drawOpEnd();

  requestAnimationFrame(loop);
}

/* ============================================================
   23. СТАРТ
   ============================================================ */
resize();
loadSave();
generateTerrain();
requestAnimationFrame(loop);

document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden) lastT = 0; });
cvs.addEventListener('pointerdown', onDown, { passive: false });
cvs.addEventListener('pointermove', onMove, { passive: false });
cvs.addEventListener('pointerup', onUp, { passive: false });
cvs.addEventListener('pointercancel', (e) => { pointers.delete(e.pointerId); G.draggingTurret = null; });
</script>
